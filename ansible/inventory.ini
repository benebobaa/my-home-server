# Proxmox nodes — MGMT VLAN 10. SSH as root with the admin key
# (default key name, found automatically).
#   laptop=true          lid switch ignored, USB-NIC autosuspend fix (pve2/pve3)
#   has_nvidia_gpu=true  host NVIDIA driver, GPU shared into LXCs (ADR 0003)
#   vfio_pci_ids=...     GPU bound to vfio-pci for one VM (pve1, ADR 0012)
#   wake_on_lan=true     NIC wakes on a magic packet (on-demand node)
[proxmox_nodes]
pve1 ansible_host=10.10.10.11 pve_nic_mac=58:11:22:db:ea:e8 pve_cluster_ip=10.10.60.11 vfio_pci_ids=10de:2503,10de:228e wake_on_lan=true
pve2 ansible_host=10.10.10.12 pve_nic_mac=9c:69:d3:cc:f0:18 pve_cluster_ip=10.10.60.12 has_nvidia_gpu=true laptop=true
pve3 ansible_host=10.10.10.13 pve_nic_mac=9c:69:d3:cc:d0:71 pve_cluster_ip=10.10.60.13 cluster_creator=true has_nvidia_gpu=true laptop=true

[proxmox_nodes:vars]
ansible_user=root
