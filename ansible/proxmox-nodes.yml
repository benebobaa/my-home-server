---
# Configure the Proxmox nodes from the repo (source of truth).
#
# The guests are OpenTofu (proxmox/opentofu); this playbook owns the *host*
# config that used to be applied by hand during setup. Idempotent — run with
# --check --diff for a drift report.
#
# Usage (from this directory):
#   ansible-playbook proxmox-nodes.yml --check --diff    # drift report
#   ansible-playbook proxmox-nodes.yml                   # converge
#   ansible-playbook proxmox-nodes.yml --limit pve3
#   ansible-playbook proxmox-nodes.yml --tags upgrade    # explicit full upgrade
#
# Mirrors docs/runbooks/proxmox-install.md §3 (post-install).

- name: Proxmox nodes — repo as source of truth
  hosts: proxmox_nodes
  gather_facts: true

  vars:
    admin_pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
    # The lab's addresses (ADR 0007): read, never retyped here.
    lab: "{{ lookup('file', playbook_dir + '/../inventory/lab.yaml') | from_yaml }}"
    pve_nic: nic0            # USB NIC name (pinned by the installer)
    cluster_name: homelab
    cluster_seed: 10.10.10.13

  tasks:
    # ------------------------------------------------------------------ repos
    - name: Find enterprise repo files
      ansible.builtin.stat:
        path: "/etc/apt/sources.list.d/{{ item }}"
      loop:
        - pve-enterprise.sources
        - ceph.sources
      register: enterprise_repos
      tags: repos

    - name: Disable enterprise repos
      ansible.builtin.lineinfile:
        path: "/etc/apt/sources.list.d/{{ item.item }}"
        regexp: '^Enabled:'
        line: 'Enabled: false'
      loop: "{{ enterprise_repos.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists
      tags: repos

    - name: Ensure the no-subscription repo is present
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      tags: repos

    # pve-manager *recommends* it, so a stock install has it; a broad
    # `apt purge ~nnvidia` during the MX130 experiment removed it from pve2.
    - name: Ensure stock PVE recommended packages are present
      ansible.builtin.apt:
        name: pve-nvidia-vgpu-helper
        state: present
      tags: repos

    - name: "Full upgrade (run explicitly: --tags upgrade)"
      ansible.builtin.apt:
        update_cache: true
        upgrade: full
      tags: [upgrade, never]

    # ------------------------------------------------------- laptop-as-server
    - name: Ignore the lid switch
      ansible.builtin.lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?HandleLidSwitch=', line: 'HandleLidSwitch=ignore' }
        - { regexp: '^#?HandleLidSwitchExternalPower=', line: 'HandleLidSwitchExternalPower=ignore' }
      tags: logind

    - name: Mask sleep/suspend targets
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target
      tags: logind

    - name: Ensure USB autosuspend fix in the GRUB cmdline
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?!.*usbcore\.autosuspend=-1).*)"$'
        replace: '\1 usbcore.autosuspend=-1"'
      notify: Update grub
      tags: grub

    # ---------------------------------------------------------------- network
    - name: Ensure NIC pinning matches the declared MAC (pve_nic_mac)
      ansible.builtin.copy:
        dest: /usr/local/lib/systemd/network/50-pmx-nic0.link
        content: |
          # managed by Ansible — see ansible/proxmox-nodes.yml (pve_nic_mac).
          [Match]
          MACAddress={{ pve_nic_mac }}
          Type=ether

          [Link]
          Name=nic0
        mode: "0644"
      tags: network

    - name: Install the canonical interfaces file
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname }}/proxmox/nodes/{{ inventory_hostname }}/interfaces"
        dest: /etc/network/interfaces
        backup: true
        mode: "0644"
      notify: Warn reboot for network
      tags: network

    # -------------------------------------------------------------------- ssh
    - name: Ensure /root/.ssh exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        mode: "0700"
      tags: ssh

    # /root/.ssh/authorized_keys is a PVE-managed symlink to
    # /etc/pve/priv/authorized_keys (cluster-shared, 0600 root:www-data) —
    # we ensure the key's presence, not the link's mode.
    # No `mode`: the path is PVE's symlink into /etc/pve/priv (pmxcfs owns the
    # permissions there).
    - name: Authorize the admin key for root  # noqa: risky-file-permissions
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ admin_pubkey }}"
        create: true
      tags: ssh

    # ------------------------------------------------------------------- gpu
    # Makes the NVIDIA GPU usable from LXC containers (device-passthrough,
    # shared — not VM/VFIO exclusive passthrough). The driver itself (dkms,
    # MOK/Secure-Boot-off) was set up by hand during the MX130 experiment —
    # see docs/experiments/mx130/README.md and docs/runbooks/secure-boot-mok.md.
    # This section only makes that driver *boot-safe for containers*:
    # unprivileged LXCs cannot load kernel modules themselves, so nvidia_uvm
    # (needed for CUDA) must already be loaded, and its device node already
    # created, before any GPU-enabled container starts — on-demand loading
    # (what a CUDA app does when run directly on the host) does not work
    # from inside a container.
    # The driver is the .run installer + dkms. NVIDIA's CUDA apt repo must not
    # be configured on the host: a full-upgrade would pull its driver/dkms
    # packages over the .run install (it had already replaced Debian's dkms on
    # pve2 when the 2026-10-08 audit found it). CUDA toolkits belong in guests.
    - name: Ensure NVIDIA's CUDA apt repo is absent
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/cuda-debian13-x86_64.list
        state: absent
      when: has_nvidia_gpu | default(false)
      tags: gpu

    - name: Ensure the CUDA repo keyring package is absent
      ansible.builtin.apt:
        name: cuda-keyring
        state: absent
        purge: true
      when: has_nvidia_gpu | default(false)
      tags: gpu

    # Without the headers meta-package, a kernel update installs no headers,
    # dkms cannot rebuild nvidia, and the GPU silently disappears on the next
    # boot. proxmox-default-headers tracks proxmox-default-kernel.
    - name: Ensure dkms + headers for every future kernel (+ nvtop for ops)
      ansible.builtin.apt:
        name:
          - dkms
          - proxmox-default-headers
          - nvtop
        state: present
        update_cache: true   # drop the removed repo's package lists first
      when: has_nvidia_gpu | default(false)
      tags: gpu

    - name: Ensure all NVIDIA kernel modules load at boot (not just on-demand)
      ansible.builtin.copy:
        dest: /etc/modules-load.d/nvidia.conf
        content: |
          # managed by Ansible — see ansible/proxmox-nodes.yml (gpu tag).
          # nvidia_uvm is required for CUDA and is NOT auto-loaded by the
          # "nvidia" module alone — without this, LXC containers (which
          # cannot load kernel modules) get /dev/nvidia-uvm missing.
          nvidia
          nvidia_uvm
          nvidia_drm
          nvidia_modeset
        mode: "0644"
      when: has_nvidia_gpu | default(false)
      notify: Reload nvidia modules
      tags: gpu

    - name: Install the nvidia-persistenced systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/nvidia-persistenced.service
        content: |
          # managed by Ansible — see ansible/proxmox-nodes.yml (gpu tag).
          # Official unit (NVIDIA driver docs: nvidia-persistenced-init/systemd/),
          # --user root since this is headless (no login session owns the GPU).
          [Unit]
          Description=NVIDIA Persistence Daemon
          Wants=syslog.target

          [Service]
          Type=forking
          ExecStart=/usr/bin/nvidia-persistenced --user root
          ExecStopPost=/bin/rm -rf /var/run/nvidia-persistenced

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      when: has_nvidia_gpu | default(false)
      tags: gpu

    - name: Enable nvidia-persistenced
      ansible.builtin.systemd_service:
        name: nvidia-persistenced.service
        enabled: true
        state: started
        daemon_reload: true
      when: has_nvidia_gpu | default(false)
      tags: gpu

    # Loading nvidia_uvm (above) is NOT enough: no udev rule ships with this
    # driver to create /dev/nvidia-uvm[-tools] on module load — confirmed by
    # rebooting pve2 cold (2026-10-08): the module was loaded, the device
    # node was not. The node normally appears "by itself" only because a
    # CUDA app run as root on the host triggers this same call internally
    # (via libcuda) — which an LXC container cannot do.
    - name: Install the nvidia-uvm device-node creation unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/nvidia-uvm-mknod.service
        content: |
          # managed by Ansible — see ansible/proxmox-nodes.yml (gpu tag).
          # Creates /dev/nvidia-uvm[-tools] at boot — no udev rule does this
          # for this driver; without it, an LXC container sees nvidia_uvm
          # loaded but the device missing (CUDA init fails).
          [Unit]
          Description=Create /dev/nvidia-uvm device nodes
          After=systemd-modules-load.service
          Before=pve-guests.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/bin/nvidia-modprobe -c0 -u

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      when: has_nvidia_gpu | default(false)
      tags: gpu

    - name: Enable nvidia-uvm-mknod
      ansible.builtin.systemd_service:
        name: nvidia-uvm-mknod.service
        enabled: true
        state: started
        daemon_reload: true
      when: has_nvidia_gpu | default(false)
      tags: gpu

    # --------------------------------------------------------------- storage
    # Guest disks live on LVM-thin (local-lvm = pve/data). Thin pools can be
    # over-committed; at 100% every guest on the pool freezes and can corrupt.
    # Auto-extend at 80% into the VG's free space (pve2 16 GB, pve3 ~15 GB) is
    # the safety margin. Via a metadata profile on the pool (lvmthin(7)), not
    # by editing the distro's lvm.conf. Requires dmeventd monitoring (active).
    - name: Install the thin-pool autoextend profile
      ansible.builtin.copy:
        dest: /etc/lvm/profile/homelab-thin-autoextend.profile
        content: |
          # managed by Ansible — see ansible/proxmox-nodes.yml (storage tag).
          activation {
              thin_pool_autoextend_threshold = 80
              thin_pool_autoextend_percent = 20
          }
        mode: "0644"
      tags: storage

    - name: Read the profile attached to the guest thin pool
      ansible.builtin.command: lvs --noheadings -o lv_profile pve/data
      register: thin_profile
      changed_when: false
      check_mode: false
      tags: storage

    - name: Attach the autoextend profile to the guest thin pool
      ansible.builtin.command: lvchange --metadataprofile homelab-thin-autoextend pve/data
      when: thin_profile.stdout | trim != 'homelab-thin-autoextend'
      changed_when: true
      tags: storage

    # Proxmox trims VM disks (with discard=on) but never container volumes:
    # files deleted inside an LXC stay allocated in the thin pool forever.
    - name: Install the container-trim script
      ansible.builtin.copy:
        dest: /usr/local/sbin/pct-fstrim-all
        content: |
          #!/bin/sh
          # managed by Ansible — see ansible/proxmox-nodes.yml (storage tag).
          # fstrim every running container on this node (pct list is node-local).
          rc=0
          for id in $(pct list | awk 'NR > 1 && $2 == "running" { print $1 }'); do
            echo "CT $id:"
            pct fstrim "$id" || { echo "CT $id: fstrim failed"; rc=1; }
          done
          exit "$rc"
        mode: "0755"
      tags: storage

    - name: Install the weekly container-trim service + timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: pct-fstrim.service
          content: |
            # managed by Ansible — see ansible/proxmox-nodes.yml (storage tag).
            [Unit]
            Description=Return space freed inside running containers to the thin pool

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/pct-fstrim-all
        - name: pct-fstrim.timer
          content: |
            # managed by Ansible — see ansible/proxmox-nodes.yml (storage tag).
            [Unit]
            Description=Weekly container fstrim

            [Timer]
            OnCalendar=Sun 03:30
            RandomizedDelaySec=30min
            Persistent=true

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      tags: storage

    - name: Enable the container-trim timer
      ansible.builtin.systemd_service:
        name: pct-fstrim.timer
        enabled: true
        state: started
        daemon_reload: true
      tags: storage

    # Keep guest memory in RAM and spare the SSDs; swap stays as a safety net.
    - name: Lower swappiness on the hosts
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-homelab.conf
        content: |
          # managed by Ansible — see ansible/proxmox-nodes.yml (storage tag).
          vm.swappiness = 10
        mode: "0644"
      tags: storage

    # Converge the *running* value too (not via a handler: the verify asserts
    # below run before end-of-play handlers would fire).
    - name: Read live swappiness
      ansible.builtin.command: cat /proc/sys/vm/swappiness
      register: live_swappiness
      changed_when: false
      check_mode: false
      tags: storage

    - name: Apply swappiness now
      ansible.builtin.command: sysctl -p /etc/sysctl.d/90-homelab.conf
      when: live_swappiness.stdout | trim != '10'
      changed_when: true
      tags: storage

    # ------------------------------------------------------------- monitoring
    # Host metrics for Prometheus (CT 120 `monitoring`, 10.10.10.16 — see
    # services/monitoring/). node_exporter + Debian's textfile collectors:
    # SMART attributes every 15 min (smartmon.sh: `smartctl -i -H -A` only,
    # never a self-test — see docs/runbooks/disk-rescue.md) and LVM thin-pool
    # data/metadata fill every minute (lvm-prom-collector -t).
    - name: Install node_exporter + textfile collectors
      ansible.builtin.apt:
        name:
          - prometheus-node-exporter
          - prometheus-node-exporter-collectors
          - moreutils          # sponge, used by the collector units
        install_recommends: false
        state: present
      tags: monitoring

    # MGMT address only: the default 0.0.0.0 would also listen on the
    # VLAN 60 cluster link. systemd collector → alerts on failed units.
    - name: Configure node_exporter (bind MGMT IP, textfile dir, systemd)
      ansible.builtin.copy:
        dest: /etc/default/prometheus-node-exporter
        content: |
          # managed by Ansible — see ansible/proxmox-nodes.yml (monitoring tag).
          ARGS="--web.listen-address={{ ansible_host }}:9100 --collector.textfile.directory=/var/lib/prometheus/node-exporter --collector.systemd"
        mode: "0644"
      notify: Restart node_exporter
      tags: monitoring

    # Binding the MGMT IP races the network at boot: on pve2's 2026-10-09
    # reboot it started before 10.10.10.12 existed ("cannot assign requested
    # address"), burned systemd's 5 quick restarts and stayed dead.
    - name: Ensure the node_exporter drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/prometheus-node-exporter.service.d
        state: directory
        mode: "0755"
      tags: monitoring

    - name: Start node_exporter after the network, retry until the MGMT IP exists
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus-node-exporter.service.d/homelab.conf
        content: |
          # managed by Ansible — see ansible/proxmox-nodes.yml (monitoring tag).
          [Unit]
          Wants=network-online.target
          After=network-online.target
          StartLimitIntervalSec=0

          [Service]
          Restart=always
          RestartSec=5s
        mode: "0644"
      notify: Restart node_exporter
      tags: monitoring

    - name: Install the thin-pool collector service + timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: prometheus-node-exporter-lvm.service
          content: |
            # managed by Ansible — see ansible/proxmox-nodes.yml (monitoring tag).
            [Unit]
            Description=Collect LVM thin-pool fill for prometheus-node-exporter

            [Service]
            Type=oneshot
            ExecStart=/bin/sh -o pipefail -c "/usr/share/prometheus-node-exporter-collectors/lvm-prom-collector -t | sponge /var/lib/prometheus/node-exporter/lvm.prom"
        - name: prometheus-node-exporter-lvm.timer
          content: |
            # managed by Ansible — see ansible/proxmox-nodes.yml (monitoring tag).
            [Unit]
            Description=Collect LVM thin-pool fill every minute

            [Timer]
            OnBootSec=30s
            OnUnitActiveSec=1min

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      tags: monitoring

    - name: Enable node_exporter and the collector timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - prometheus-node-exporter.service
        - prometheus-node-exporter-smartmon.timer
        - prometheus-node-exporter-lvm.timer
      tags: monitoring

    # ---------------------------------------------------------------- logging
    # The node's journal → the lab log store (VictoriaLogs, CT 121 `logs`;
    # ADR 0008). The same setup as services/logs/ship.sh in the containers:
    # systemd-journal-upload with a saved cursor, so it catches up after an
    # outage of the store. Its address comes from inventory/lab.yaml.
    - name: Install systemd-journal-upload
      ansible.builtin.apt:
        name: systemd-journal-remote
        state: present
        install_recommends: false
      tags: logging

    # The package also ships a journal receiver (port 19532): keep it off.
    - name: Keep the journal receiver off
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        masked: true
        state: stopped
      loop:
        - systemd-journal-remote.socket
        - systemd-journal-remote.service
      tags: logging

    - name: Ensure the journal-upload drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journal-upload.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: logging

    - name: Point journal-upload at the log store
      ansible.builtin.copy:
        dest: /etc/systemd/journal-upload.conf.d/homelab.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # managed by ansible/proxmox-nodes.yml (tag logging)
          [Upload]
          URL=http://{{ lab.hosts.logs.ip }}:9428/insert/journald
      notify: Restart journal-upload
      tags: logging

    - name: Enable journal-upload
      ansible.builtin.systemd_service:
        name: systemd-journal-upload.service
        enabled: true
        state: started
      tags: logging

    # ----------------------------------------------------------------- verify
    - name: Read FQDN
      ansible.builtin.command: hostname -f
      register: fqdn
      changed_when: false
      check_mode: false
      tags: verify

    - name: Assert FQDN
      ansible.builtin.assert:
        that: fqdn.stdout == inventory_hostname + '.home.arpa'
        fail_msg: "hostname -f is '{{ fqdn.stdout }}', expected '{{ inventory_hostname }}.home.arpa'"
      tags: verify

    - name: Read USB NIC speed
      ansible.builtin.command: "ethtool {{ pve_nic }}"
      register: ethtool
      changed_when: false
      check_mode: false
      failed_when: false
      tags: verify

    - name: Assert the USB NIC runs at 1000Mb/s
      ansible.builtin.assert:
        that: "'Speed: 1000Mb/s' in ethtool.stdout"
        fail_msg: "{{ pve_nic }} is not at 1000Mb/s — replace the adapter (see runbook)"
      when: ethtool.rc == 0
      tags: verify

    - name: Read kernel cmdline
      ansible.builtin.command: cat /proc/cmdline
      register: cmdline
      changed_when: false
      check_mode: false
      tags: verify

    - name: Assert the USB autosuspend fix is active
      ansible.builtin.assert:
        that: "'usbcore.autosuspend=-1' in cmdline.stdout"
        fail_msg: "GRUB has the fix but the kernel didn't get it — reboot pending?"
      tags: verify

    # Read-only probes below use systemctl directly: the systemd module would
    # report masked/inactive units as failures or need extra parsing.
    - name: Read sleep target state  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-enabled sleep.target
      register: sleep_state
      changed_when: false
      check_mode: false
      failed_when: false
      tags: verify

    - name: Assert sleep is masked
      ansible.builtin.assert:
        that: sleep_state.stdout == 'masked'
        fail_msg: "sleep.target is '{{ sleep_state.stdout }}' — laptops must not sleep"
      tags: verify

    - name: Read nic0 MAC
      ansible.builtin.command: cat /sys/class/net/{{ pve_nic }}/address
      register: nic_mac
      changed_when: false
      check_mode: false
      failed_when: false
      tags: verify

    - name: Assert nic0 MAC matches the declared pinning
      ansible.builtin.assert:
        that: nic_mac.stdout == pve_nic_mac
        fail_msg: "{{ pve_nic }} is '{{ nic_mac.stdout }}', declared '{{ pve_nic_mac }}' — update inventory.ini"
      tags: verify

    - name: Report version
      ansible.builtin.command: pveversion
      register: pvever
      changed_when: false
      check_mode: false
      tags: verify

    - name: Version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ pvever.stdout }}"
      tags: verify

    - name: Stat the nvidia_uvm device node
      ansible.builtin.stat:
        path: /dev/nvidia-uvm
      register: nvidia_uvm_dev
      when: has_nvidia_gpu | default(false)
      tags: verify

    - name: Assert /dev/nvidia-uvm exists (boot-time, not on-demand)
      ansible.builtin.assert:
        that: nvidia_uvm_dev.stat.exists
        fail_msg: >-
          /dev/nvidia-uvm is missing — a GPU-enabled LXC would fail to get
          CUDA. Check modules-load.d/nvidia.conf applied and reboot pending?
      when: has_nvidia_gpu | default(false)
      tags: verify

    - name: Read nvidia-persistenced state  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active nvidia-persistenced.service
      register: persistenced_state
      changed_when: false
      check_mode: false
      failed_when: false
      when: has_nvidia_gpu | default(false)
      tags: verify

    - name: Assert nvidia-persistenced is active
      ansible.builtin.assert:
        that: persistenced_state.stdout == 'active'
        fail_msg: "nvidia-persistenced is '{{ persistenced_state.stdout }}', expected 'active'"
      when: has_nvidia_gpu | default(false)
      tags: verify

    - name: Read storage safety state
      ansible.builtin.shell: |
        set -o pipefail
        echo "profile=$(lvs --noheadings -o lv_profile pve/data | tr -d ' ')"
        echo "monitor=$(lvs --noheadings -o seg_monitor pve/data | tr -d ' ')"
        echo "swappiness=$(cat /proc/sys/vm/swappiness)"
        echo "trimtimer=$(systemctl is-active pct-fstrim.timer)"
      args:
        executable: /bin/bash
      register: storage_state
      changed_when: false
      check_mode: false
      tags: verify

    - name: Read node_exporter state
      ansible.builtin.shell: |
        set -o pipefail
        echo "exporter=$(systemctl is-active prometheus-node-exporter)"
        ss -ltnH "sport = :9100" | awk '{print "listen=" $4}'
      args:
        executable: /bin/bash
      register: exporter_state
      changed_when: false
      check_mode: false
      tags: verify

    - name: Assert node_exporter runs on the MGMT IP only
      ansible.builtin.assert:
        that:
          - "'exporter=active' in exporter_state.stdout"
          - "exporter_state.stdout_lines | select('match', '^listen=') | list == ['listen=' + ansible_host + ':9100']"
        fail_msg: "node_exporter drifted: {{ exporter_state.stdout_lines }}"
      tags: verify

    - name: Assert thin-pool autoextend, monitoring, swappiness, trim timer
      ansible.builtin.assert:
        that:
          - "'profile=homelab-thin-autoextend' in storage_state.stdout"
          - "'monitor=monitored' in storage_state.stdout"
          - "'swappiness=10' in storage_state.stdout"
          - "'trimtimer=active' in storage_state.stdout"
        fail_msg: "storage safety drifted: {{ storage_state.stdout_lines }}"
      tags: verify

    # ---------------------------------------------------------------- cluster
    # One-time bootstrap, explicit only:
    #   ansible-playbook proxmox-nodes.yml --tags cluster
    # See docs/runbooks/proxmox-cluster.md (prerequisites + gotchas).
    - name: Check cluster status
      ansible.builtin.command: pvecm status
      register: pvecm_status
      changed_when: false
      check_mode: false
      failed_when: false
      tags: [cluster, never]

    - name: Create the cluster (seed node)
      ansible.builtin.command: "pvecm create {{ cluster_name }} --link0 {{ pve_cluster_ip }}"
      when:
        - pvecm_status.rc != 0
        - cluster_creator | default(false) | bool
      changed_when: true
      tags: [cluster, never]

    - name: Join the cluster (other nodes)
      ansible.builtin.command: >-
        pvecm add {{ cluster_seed }} --use_ssh --link0 {{ pve_cluster_ip }} --force
      when:
        - pvecm_status.rc != 0
        - not (cluster_creator | default(false) | bool)
      changed_when: true
      tags: [cluster, never]

  handlers:
    - name: Restart journal-upload
      ansible.builtin.systemd_service:
        name: systemd-journal-upload.service
        state: restarted

    - name: Restart node_exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter.service
        state: restarted
        daemon_reload: true

    - name: Update grub
      ansible.builtin.command: update-grub
      changed_when: true

    - name: Warn reboot for network
      ansible.builtin.debug:
        msg: >-
          /etc/network/interfaces changed — reboot {{ inventory_hostname }}
          to apply it (the live session keeps the old config until then).

    - name: Reload nvidia modules
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - nvidia_uvm
        - nvidia_drm
        - nvidia_modeset
      changed_when: true
      # Already loaded on a node that ran the MX130 experiment by hand — this
      # only matters the first time a fresh GPU node applies this playbook.
