# Pinned toolchain — the same versions locally (`mise install`) and in CI
# (.github/workflows/check.yml). Bump deliberately, one tool per commit.
# The lab's own versions are pinned elsewhere: providers in each stack's
# .terraform.lock.hcl, guest software in services/<name>/.
[tools]
opentofu = "1.13.1"
"aqua:terraform-linters/tflint" = "0.64.0"
sops = "3.13.3"
age = "1.3.2"
shellcheck = "0.11.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
# Same release as the monitoring CT (Debian 13), so rule checks match prod.
"aqua:prometheus/prometheus" = "2.53.3"
"aqua:prometheus/alertmanager" = "0.28.1"
uv = "0.12.23"
"pipx:yamllint" = "1.38.0"
"pipx:ansible-core" = "2.18.7"
"pipx:ansible-lint" = { version = "25.6.1", uvx_args = "--with ansible-core==2.18.7" }

[settings]
experimental = true
pipx.uvx = true
