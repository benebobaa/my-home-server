# Grafana datasources (installed by setup.sh). Fixed uids: the generated
# boards (scripts/dashboards) name them, and `make check` refuses any other.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      # The global scrape_interval (prometheus.yml). Grafana sizes
      # $__rate_interval from it (at least 4 scrapes = 2 minutes), which is
      # enough for the 60 s SNMP job. Boards never hardcode a rate window.
      timeInterval: 30s
  # Alerts + silences in the Grafana UI (Alertmanager itself listens on
  # localhost only: it has no login).
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://127.0.0.1:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
  # The lab log store (CT 121, services/logs). By name, not IP: the hEX
  # serves <name>.home.arpa from inventory/lab.yaml.
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://logs.home.arpa:9428
    editable: false
  # The lab trace store (CT 122, services/traces, ADR 0028). Grafana's Tempo
  # data source reads VictoriaTraces' Tempo API, which is what Traces
  # Drilldown needs: TraceQL search and TraceQL metrics (RED).
  - name: Traces
    uid: traces
    type: tempo
    access: proxy
    url: http://traces.home.arpa:10428/select/tempo
    editable: false
  # Fallback for the same store: VictoriaTraces documents the Jaeger API as
  # its stable query path and the Tempo API above as experimental (ADR 0036).
  # If a release breaks Tempo queries, trace search still works here.
  - name: Traces (Jaeger)
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://traces.home.arpa:10428/select/jaeger
    editable: false
