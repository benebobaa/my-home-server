# Grafana datasource (installed by setup.sh). Fixed uid: the downloaded
# dashboards are rewritten to point at it.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
  # Alerts + silences in the Grafana UI (Alertmanager itself listens on
  # localhost only: it has no login).
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://127.0.0.1:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
  # The lab log store (CT 121, services/logs). By name, not IP: the hEX
  # serves <name>.home.arpa from inventory/lab.yaml.
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://logs.home.arpa:9428
    editable: false
  # The lab trace store (CT 122, services/traces, ADR 0028). Grafana's Tempo
  # data source reads VictoriaTraces' Tempo API, which is what Traces
  # Drilldown needs: TraceQL search and TraceQL metrics (RED).
  - name: Traces
    uid: traces
    type: tempo
    access: proxy
    url: http://traces.home.arpa:10428/select/tempo
    editable: false
