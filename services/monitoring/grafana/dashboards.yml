# Boards are generated by scripts/dashboards (ADR 0036) and pushed by
# terraform_data.monitoring_dashboards. Edits in the UI are not kept.
#
# Folders come from the directory names under the path (Infrastructure,
# Network, ...); the Overview sits at the root. disableDeletion is false on
# purpose: a board whose file is removed must disappear from Grafana, or the
# old boards would stay as orphans (Grafana's provisioning docs: it deletes
# a board unless disableDeletion is true).
apiVersion: 1
providers:
  - name: homelab
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
