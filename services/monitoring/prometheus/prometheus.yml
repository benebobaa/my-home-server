# Prometheus — lab monitoring (CT 120 `monitoring`, 10.10.10.16, VLAN 10).
# Installed by setup.sh; validated with promtool before every reload.
# Friendly `instance` names everywhere (pve2, hex, …) so alerts read well and
# the inhibit rules in alertmanager.yml can match across jobs.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  # --- the monitoring stack itself ------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: { instance: monitoring, tier: critical }

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
        labels: { instance: monitoring, tier: critical }

  # --- generated targets ------------------------------------------------------
  # Everything below except the internet probes comes from the `monitoring:`
  # blocks in inventory/lab.yaml (ADR 0008): OpenTofu writes one file per job
  # to /etc/prometheus/targets/ (targets.py). Never add a lab host here.
  # Every generated target carries `instance` (inventory name) and `tier`.

  # Proxmox nodes: node_exporter (Ansible `monitoring` tag). The CT's own
  # exporter is local.
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets/node.json]
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: { instance: monitoring, tier: critical }

  # Proxmox API: prometheus-pve-exporter (read-only PVEAuditor token).
  # Cluster-wide series (guests, storage, quorum) come from ONE node only
  # (__param_cluster in the generated labels), or every series and alert
  # would be doubled.
  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
    file_sd_configs:
      - files: [/etc/prometheus/targets/pve.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: 127.0.0.1:9221

  # App metrics: every `metrics: [ports]` in lab.yaml, at /metrics.
  - job_name: service
    file_sd_configs:
      - files: [/etc/prometheus/targets/service.json]

  # App metrics from the untrusted zones (ADR 0013, 0014): the DMZ (the
  # Kubeletto cluster, tenant code) and the LAB (`ai`, the GPU workstation:
  # pip/GitHub code). No redirects, and hard limits so a hostile /metrics
  # cannot exhaust Prometheus. Over a limit the scrape fails, which shows as
  # the target down (TargetDown alert). The name stays service_dmz.
  # Sized 2026-10-12: k3s served 125 samples, 21 KB, at most 5 labels.
  # 2026-10-13: ai's nvidia_gpu_exporter serves 149 samples, 30 KB, and
  # nvidia_smi_gpu_info carries 12 labels + 5 target labels = 17, so the
  # label limit is 24 (16 failed every scrape).
  - job_name: service_dmz
    follow_redirects: false
    body_size_limit: 4MB
    sample_limit: 20000
    label_limit: 24
    label_name_length_limit: 64
    label_value_length_limit: 256
    file_sd_configs:
      - files: [/etc/prometheus/targets/service_dmz.json]
    # 2026-10-28: pod-level series are born and die with every build and cold
    # start. Seven kube-state families that no rule reads were about 65 % of
    # the pod series seen in 2 h, so they are dropped at ingest. The families
    # k8s.yml and its tests read stay.
    # Vector (K3s :30598, 2026-10-29) serves ~2,000 series per node, ~390 KB;
    # keep the few the logs alerts read (rules/k8s.yml) and drop the rest
    # (histogram buckets per component). RE2 has no negative match, hence
    # the temporary label.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: kube_pod_(status_(reason|ready|scheduled|qos_class)|container_info|tolerations|container_resource_limits)
        action: drop
      - source_labels: [__name__]
        regex: vector_(component_discarded_events_total|component_errors_total|started_total)
        target_label: __tmp_keep
        replacement: "1"
      - source_labels: [__name__, __tmp_keep]
        regex: "vector_.*;"
        action: drop
      - regex: __tmp_keep
        action: labeldrop

  # hEX router: SNMPv3 (read-only, monitoring IP only).
  # 60 s: the hEX is a small MIPS box; SNMP walks cost it CPU.
  - job_name: snmp_hex
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      module: [system, if_mib, hrDevice, hrStorage, mikrotik]
      auth: [hex_v3]
    file_sd_configs:
      - files: [/etc/prometheus/targets/snmp.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: 127.0.0.1:9116

  # --- reachability: blackbox_exporter --------------------------------------
  # Every live host with a monitoring block is pinged. The two public
  # resolvers are not lab hosts: they stay here (role=internet).
  - job_name: blackbox_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: [/etc/prometheus/targets/icmp.json]
    static_configs:
      - targets: ["1.1.1.1"]
        labels: { instance: internet-cloudflare, role: internet }
      - targets: ["8.8.8.8"]
        labels: { instance: internet-google, role: internet }
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # `health:` URLs. The module (http_2xx, or http_any for UIs that answer
  # 401/redirects) comes per target as __param_module.
  - job_name: blackbox_http
    metrics_path: /probe
    file_sd_configs:
      - files: [/etc/prometheus/targets/http.json]
    relabel_configs: *blackbox_relabel

  # Kubeletto from the outside (the public edge path; nothing else watches
  # it: the k3s health probe goes through a NodePort inside the lab).
  - job_name: blackbox_public
    metrics_path: /probe
    scrape_interval: 60s
    static_configs:
      - targets: ["https://api.kubeletto.com/healthz"]
        labels: { instance: kubeletto-api, role: public, __param_module: public_2xx }
      - targets: ["https://api.kubeletto.com/v1/registry/auth?service=registry.kubeletto.com&scope=repository:probe/probe:pull"]
        labels: { instance: kubeletto-registry-auth, role: public, __param_module: public_registry_auth }
    relabel_configs: *blackbox_relabel

  # The hEX resolver answers every lab VLAN: probe it like a client would.
  - job_name: blackbox_dns
    metrics_path: /probe
    params:
      module: [dns_public_name]
    file_sd_configs:
      - files: [/etc/prometheus/targets/dns.json]
    relabel_configs: *blackbox_relabel
