# Kubeletto's K3s cluster (hosts k3s, k3s-worker): kube-state-metrics on the
# server node, scraped by job service_dmz (docs/runbooks/kubeletto-migration.md).
#
# Why these exist: free RAM does not show the failure that took production
# down on 2026-10-11. The node sat at 99 % of memory REQUESTS with plenty of
# free memory, tenant pods went Pending ("Insufficient memory") and cold
# starts failed. Tenant requests are overcommitted at home too (Kubeletto
# docs/migration D9), so the scheduler's view needs its own alerts next to
# HostMemoryLow (node_exporter, hosts.yml). At home the crash-loop suspender
# is log-only (D5), so a Pending pod no longer cascades into deleted
# services, but an unschedulable pod is still a tenant that cannot start.
#
# Label gotcha: every generated target carries `node` (the Proxmox node that
# holds the VM, e.g. pve2) and the DMZ scrape does not honor labels, so
# kube-state-metrics' own `node` (k3s, k3s-worker) arrives as `exported_node`.
groups:
  - name: k8s
    rules:
      # The scheduler refused a pod. Scale-from-zero makes brief Pending
      # normal (image pull, a few seconds), but only an unschedulable pod
      # sits here: "Pending for a while" is not enough to alert on.
      - alert: K8sPodUnschedulable
        expr: sum by (instance) (kube_pod_status_unschedulable{job="service_dmz"}) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $value }} pod(s) unschedulable for 5 min (a tenant cannot start)"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8spodunschedulable

      # Memory reserved by pods (requests) against what a node can hand out
      # (allocatable). Only pods that hold a reservation count: Running and
      # scheduled Pending ones; Succeeded and Failed pods keep their request
      # series in kube-state-metrics, so the join on the phase drops them.
      # Above ~90 % the next build or cold start has no room.
      - alert: K8sNodeMemoryRequestsHigh
        expr: |
          sum by (exported_node) (
            kube_pod_container_resource_requests{job="service_dmz", resource="memory"}
            * on (namespace, pod, uid) group_left ()
            (kube_pod_status_phase{job="service_dmz", phase=~"Pending|Running"} == 1)
          )
          / on (exported_node)
          kube_node_status_allocatable{job="service_dmz", resource="memory"}
          > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.exported_node }}: pods request {{ $value | humanizePercentage }} of allocatable memory"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8snodememoryrequestshigh

      # The kubelet itself says it is short of memory and starts evicting.
      - alert: K8sNodeMemoryPressure
        expr: kube_node_status_condition{job="service_dmz", condition="MemoryPressure", status="true"} == 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.exported_node }}: MemoryPressure, the kubelet is evicting pods"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8snodememorypressure

  # The platform itself (core, NATS, Valkey, the registry and its mirror,
  # Traefik, Kourier, Knative, cloudflared, logs, kube-system): the 2026-10-14
  # architecture review found that nothing alerted when one of them failed
  # (docs/design/kubeletto-architecture.md, weakness 2). Tenant apps (kl-*)
  # and build pods are excluded: their failures are their owners'.
  - name: k8s-platform
    rules:
      - alert: K8sPlatformPodNotReady
        expr: |
          (kube_pod_container_status_ready{job="service_dmz", namespace!~"kl-.*|kubeletto-builds"} == 0)
            and on (namespace, pod) (kube_pod_status_phase{job="service_dmz", phase="Running"} == 1)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "k3s: {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) runs but is not ready for 10 min"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8splatformpodnotready

      # A container that cannot start at all: crash loop, image pull, a
      # missing Secret or ConfigMap. kube-state-metrics only has the series
      # while the container waits.
      - alert: K8sPlatformPodWaiting
        expr: |
          kube_pod_container_status_waiting_reason{job="service_dmz", namespace!~"kl-.*|kubeletto-builds",
            reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError"} == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "k3s: {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) stuck in {{ $labels.reason }} for 10 min"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8splatformpodwaiting

      # More than 2 restarts in 30 min: a node reboot restarts each container
      # once, so this is a component falling over, not maintenance.
      - alert: K8sPlatformPodRestarting
        expr: increase(kube_pod_container_status_restarts_total{job="service_dmz", namespace!~"kl-.*|kubeletto-builds"}[30m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "k3s: {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $value | humanize }} times in 30 min"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8splatformpodrestarting

  # Tenant logs that never reached VictoriaLogs, from Vector's own metrics
  # (K3s :30598, one target per node; prometheus.yml keeps only these
  # series). Nothing watched them after the move home: on 2026-10-29 a
  # report claimed the throttle had dropped a tenant's 429 lines, and no
  # metric could say yes or no (it had not: the lines were all stored).
  - name: k8s-logs
    rules:
      # The per-tenant cap (Kubeletto infra/k8s/home/vector.toml,
      # kubeletto_throttle_runtime: 6000 events per 10 s per tenant per node)
      # dropped events, so that tenant's `kubeletto logs` has holes.
      - alert: K8sTenantLogsThrottled
        expr: increase(vector_component_discarded_events_total{job="service_dmz", component_id="kubeletto_throttle_runtime"}[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: Vector's per-tenant throttle dropped {{ $value | humanize }} log events in 15 min"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8stenantlogsthrottled

      # Events lost by failure, not by a filter or the throttle (those are
      # intentional="true"): a sink rejected or dropped them.
      - alert: K8sLogsDropped
        expr: increase(vector_component_discarded_events_total{job="service_dmz", intentional="false"}[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: Vector lost {{ $value | humanize }} log events in {{ $labels.component_id }} in 15 min"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8slogsdropped

  # Kubeletto's usage meters (Kubeletto D11): core turns the access logs and
  # tenant logs in its VictoriaLogs into usage_samples, 5-minute windows read
  # 2 min after they close, and serves each meter's checkpoint on :30080
  # /metrics. After the move home the old meters wrote nothing for 17 days and
  # nobody could see it: the request caps and usage page silently stopped.
  - name: k8s-usage
    rules:
      # Healthy lag is 7-13 min. 30 min is about four windows behind: the
      # meter is failing (VictoriaLogs or Postgres) or no leader runs it.
      - alert: KubelettoUsageMeterStale
        expr: time() - kubeletto_usage_meter_processed_until_seconds{job="service_dmz"} > 1800
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Kubeletto's {{ $labels.meter }} meter is {{ $value | humanizeDuration }} behind"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettousagemeterstale

      # The endpoint answers but a meter has no checkpoint: core was deployed
      # without VICTORIALOGS_URL, or the meter never started. (When the
      # endpoint itself is down, TargetDown says so instead.)
      - alert: KubelettoUsageMeterMissing
        expr: |
          (
            absent(kubeletto_usage_meter_processed_until_seconds{job="service_dmz", meter="http_requests"})
            or absent(kubeletto_usage_meter_processed_until_seconds{job="service_dmz", meter="log_bytes"})
          )
          and on() up{job="service_dmz", instance="k3s", port="30080"} == 1
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Kubeletto's {{ $labels.meter }} meter reports no checkpoint"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettousagemeterstale

  # Tenant apps that misbehave without being down (2026-11-06). Two free apps
  # cost the platform far more than their traffic: one scale-to-zero app was
  # woken every two minutes (715 new pods a day) and pulled 40-50 GB a day from
  # the internet; another crash-looped about 7,000 times in 21 days because a
  # required secret was unset. Neither was visible: tenant pods are expected
  # to come and go.
  - name: k8s-tenants
    rules:
      # Distinct pods of one tenant namespace in 24 h (every pod is its own
      # kube-state-metrics series). A scale-to-zero app that something pings
      # every few minutes starts a fresh pod each time. 200 a day is a pod
      # every 7 minutes, far above a normal app.
      - alert: K8sTenantColdStartChurn
        expr: count by (namespace) (last_over_time(kube_pod_info{job="service_dmz", namespace=~"kl-.*"}[1d])) > 200
        for: 1h
        # info, not warning: on 2026-11-06 six free tenants were over the line
        # (240 to 715 pods a day) and only one of them pulled much from the
        # network. The churn is for the weekly review; TenantWorkerInbound
        # Sustained is the alert that says it costs bandwidth.
        labels: { severity: info }
        annotations:
          summary: "{{ $labels.namespace }}: {{ $value }} pods in 24 h (a scale-to-zero app woken every few minutes by a pinger?)"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8stenantcoldstartchurn

      # Restarts of tenant app containers, summed over the namespace's pods
      # (a crash loop spreads over several revisions' pods). More than 10 an
      # hour for 3 hours is a loop, not a deploy.
      - alert: K8sTenantContainerRestarting
        expr: |
          sum by (namespace) (
            increase(kube_pod_container_status_restarts_total{job="service_dmz", namespace=~"kl-.*", container="user-container"}[1h])
          ) > 10
        for: 3h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}: tenant container restarted {{ $value | humanize }} times in the last hour, for 3 h (a crash loop)"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8stenantcontainerrestarting

      # Every tenant namespace must carry kubeletto-base-policy. The router's
      # worker pinholes to Postgres 5432 and Valkey 6381 apply to every pod on
      # the worker, so that policy (private ranges blocked) is what keeps other
      # tenants off the data stores (docs/experiments/2026-11-06-dmz-isolation-audit.md).
      # The last line is a guard: before kube-state-metrics exports
      # networkpolicies there are no such series at all, and "has no policy"
      # would be true for every namespace.
      - alert: K8sTenantNamespaceWithoutNetworkPolicy
        expr: |
          (
            kube_namespace_created{job="service_dmz", namespace=~"kl-.*"}
            unless on (namespace)
            kube_networkpolicy_created{job="service_dmz", networkpolicy="kubeletto-base-policy"}
          )
          and on () (count(kube_networkpolicy_created{job="service_dmz"}) > 0)
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.namespace }} has no kubeletto-base-policy: its pods are not fenced off from the lab network"
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8stenantnamespacewithoutnetworkpolicy
