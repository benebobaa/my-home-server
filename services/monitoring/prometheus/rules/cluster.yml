# Proxmox cluster `homelab` — prometheus-pve-exporter (cluster series come
# from pve2 only; see prometheus.yml).
groups:
  - name: cluster
    rules:
      # Three-node cluster: with two nodes down it is non-quorate, guests keep
      # running but management (start/stop/config, backups) locks.
      - alert: PveClusterNotQuorate
        expr: pve_cluster_info{quorate!="1"} == 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Cluster {{ $labels.id }} is NOT quorate: management actions are locked"
          description: "Cluster {{ $labels.id }} has lost quorum: guests keep running, but starting, stopping, configuring and backing up guests is locked. Run pvecm status on a surviving node to see which nodes are missing and bring them back."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#pveclusternotquorate
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-proxmox

      # Severity from the node's tier, read off its node_exporter target:
      # `up` exists while the node is off (value 0), unlike any node_* series.
      # A best-effort node is off by design, so it gets one silent message.
      # pve1 is standard since ADR 0023 (always on): when it is down, critical.
      # A node without a target stays critical.
      - alert: PveNodeDown
        expr: |
          (label_replace(pve_up{id=~"node/.*"}, "node", "$1", "id", "node/(.*)") == 0)
            + on (node) group_left (tier) (0 * max by (node, tier) (up{job="node"}))
          or
          (label_replace(pve_up{id=~"node/.*"}, "node", "$1", "id", "node/(.*)") == 0)
            unless on (node) up{job="node"}
        for: 2m
        labels:
          severity: '{{ if eq $labels.tier "best-effort" }}info{{ else if eq $labels.tier "standard" }}warning{{ else }}critical{{ end }}'
        annotations:
          summary: "Proxmox node {{ $labels.node }} is offline in the cluster"
          description: "Proxmox node {{ $labels.node }} has been offline in the cluster for 2 min, and its guests' and its own host alerts are suppressed while this fires. Check its power and switch link first (node-ops runbook), then wait for the cluster to be quorate again."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#pvenodedown
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-proxmox

      # Only guests that should be running: onboot=1 (the archive CT is
      # deliberately not boot-safe yet and is excluded by that).
      - alert: PveGuestDown
        expr: |
          (pve_up{id=~"(lxc|qemu)/.*"} == 0)
            * on (id) group_left (name, node) pve_guest_info
            and on (id) (pve_onboot_status == 1)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} ({{ $labels.id }} on {{ $labels.node }}) is not running"
          description: "{{ $labels.name }} ({{ $labels.id }}) is set to start on boot but has not been running on {{ $labels.node }} for 5 min. Check pct or qm status and the start log; if it was stopped on purpose, set start_on_boot to false in its Tofu definition."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#pveguestdown
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-proxmox

      # Directory storages (`local`: ISOs, templates, backups-to-come). The
      # thin pools are watched directly (hosts.yml, ThinPool*).
      - alert: PveStorageFilling
        expr: |
          pve_disk_usage_bytes{id=~"storage/.*", id!~"storage/.*/local-lvm"}
            / pve_disk_size_bytes{id=~"storage/.*", id!~"storage/.*/local-lvm"} > 0.90
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.id }} is {{ $value | humanizePercentage }} full"
          description: "The Proxmox storage {{ $labels.id }} is {{ $value | humanizePercentage }} full; it holds ISOs, templates and backups. Remove old templates and ISOs (pveam list local, pvesm free) before it fills."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#pvestoragefilling
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-proxmox

      # A guest no backup job covers (PBS, ADR 0009). The PBS CT itself is
      # excluded from the nightly job on purpose: its disk *is* the datastore.
      # This checks coverage, not freshness: a failed nightly run arrives as
      # a Proxmox notification (warnings/errors → Telegram).
      - alert: PveGuestNotBackedUp
        expr: |
          (pve_not_backed_up_info == 1)
            * on (id) group_left (name, node) pve_guest_info{template="0"}
            unless on (id) pve_guest_info{name="pbs"}
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} ({{ $labels.id }} on {{ $labels.node }}) is in no backup job"
          description: "{{ $labels.name }} ({{ $labels.id }} on {{ $labels.node }}) has been in no backup job for over 1 h, so it has no backups at all. Check the nightly job's exclusions and the PBS storage, and re-converge Tofu in proxmox/opentofu if the job was changed."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#pveguestnotbackedup
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-proxmox
