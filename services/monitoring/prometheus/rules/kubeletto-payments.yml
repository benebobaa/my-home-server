# The payment path of Kubeletto (docs/design/platform-operating-model.md D31).
#
# Why these exist: eight payments-* alerts watched the core's log lines in
# OpenObserve (money taken with no plan granted, the SumoPod webhook failing,
# the gateway unreachable, ...). The move home removed OpenObserve and they paged
# nobody; a customer who paid and got nothing would have been found by email
# (found 2026-11-09 while doing CONSOLE-021). Vector in the cluster now counts
# those lines as kubeletto_payment_events_total{event=...} (kubeletto repo,
# infra/k8s/home/vector.toml), scraped from :30598 by job service_dmz.
#
# Counter gotcha: log_to_metric creates a series on its first event, so the
# first event of a kind has no earlier sample and increase() reports 0 for it.
# That is exactly the case that matters (the baseline of paid_no_plan is 0), so
# the recording rule adds the value of any series that did not exist 15 minutes
# ago, but only where that Vector target was up and scraped then (up offset 15m
# == 1). Without that guard a Prometheus restart or a scrape gap (a power cut)
# would make every existing counter look new and page a false "paid, no plan".
# It is summed over the nodes' Vector pods; a Vector restart resets a counter,
# which increase() handles.
groups:
  - name: kubeletto-payments-recording
    rules:
      - record: kubeletto:payment_events:new_15m
        expr: |
          (sum by (event) (increase(kubeletto_payment_events_total[15m])) or sum by (event) (kubeletto_payment_events_total) * 0)
          +
          (sum by (event) ((kubeletto_payment_events_total unless kubeletto_payment_events_total offset 15m) and on (job, instance, port) (up{job="service_dmz"} offset 15m == 1)) or sum by (event) (kubeletto_payment_events_total) * 0)

  - name: kubeletto-payments
    rules:
      # A payment the gateway says is done but that could not be matched or
      # activated, or an underpayment: money taken, no plan granted. Baseline is
      # 0, so one is enough. keep_firing_for holds it past the 15 minute window
      # so a message sent at night is still firing in the morning.
      - alert: KubelettoPaymentPaidNoPlan
        expr: kubeletto:payment_events:new_15m{event="paid_no_plan"} > 0
        keep_firing_for: 6h
        labels: { severity: critical }
        annotations:
          summary: "Kubeletto: a payment was completed but no plan was granted ({{ $value | humanize }} in 15 min)"
          description: "SumoPod reports a payment completed that the core could not match to an order or activate, or the customer paid less than the plan price. Money was taken and no plan was granted. Reconcile the payments row by hand now."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettopaymentpaidnoplan
          dashboard_url: http://10.10.10.16:3000/d/homelab-apps-kubeletto

      # The webhook handler returned non-2xx, so SumoPod will retry; every retry
      # fails until someone looks. Any processing error, not only a mismatch.
      - alert: KubelettoPaymentWebhookFailed
        expr: kubeletto:payment_events:new_15m{event="webhook_failed"} > 0
        keep_firing_for: 3h
        labels: { severity: critical }
        annotations:
          summary: "Kubeletto: the SumoPod payment webhook failed to process ({{ $value | humanize }} in 15 min)"
          description: "The core failed to process a payment.completed webhook and returned an error, so SumoPod will retry it. Until it is fixed a paying customer may have no plan. Read the platform-core log for 'webhook completion processing failed'."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettopaymentwebhookfailed
          dashboard_url: http://10.10.10.16:3000/d/homelab-apps-kubeletto

      # The reconciler logs one line an hour even when there is nothing to do.
      # Its absence means renewal reminders and lapse downgrades have stopped.
      # increase over 150 min is two missed ticks plus jitter; absent_over_time
      # covers a counter that vanished with a Vector restart and never came back.
      - alert: KubelettoPaymentsReconcilerStale
        expr: |
          sum(increase(kubeletto_payment_events_total{event="reconcile_sweep_completed"}[150m])) == 0
          or
          sum(absent_over_time(kubeletto_payment_events_total{event="reconcile_sweep_completed"}[150m]))
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Kubeletto: the payments reconciler has not completed a sweep in over 150 minutes"
          description: "The hourly plan-expiry reconciler logs a heartbeat even when idle, and none was seen for 150 minutes: renewal reminders and lapse downgrades have silently stopped. Check the platform-core pod and its log for 'plan expiry reconcile sweep'. If Vector itself is down, TargetDown says so too."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettopaymentsreconcilerstale
          dashboard_url: http://10.10.10.16:3000/d/homelab-apps-kubeletto

      # Three or more bad signatures in 15 minutes: a rotated or wrong secret
      # would drop every real payment silently. One or two are scanner noise on
      # a public unauthenticated endpoint.
      - alert: KubelettoPaymentWebhookSignatureRejected
        expr: kubeletto:payment_events:new_15m{event="signature_rejected"} >= 3
        labels: { severity: warning }
        annotations:
          summary: "Kubeletto: {{ $value | humanize }} SumoPod webhook signatures rejected in 15 min"
          description: "Three or more webhook signature checks failed in 15 minutes. Probes of the public endpoint do this, but so does a rotated or mistyped webhook secret, which would silently drop every real payment. Compare SUMOPOD_WEBHOOK_SECRET with the SumoPod dashboard."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettopaymentwebhooksignaturerejected
          dashboard_url: http://10.10.10.16:3000/d/homelab-apps-kubeletto

      # SumoPod itself failing at checkout: customers see "payment provider is
      # unavailable" and cannot buy. Two in 15 minutes skips a single blip.
      - alert: KubelettoPaymentGatewayUnavailable
        expr: kubeletto:payment_events:new_15m{event="gateway_unavailable"} >= 2
        labels: { severity: warning }
        annotations:
          summary: "Kubeletto: {{ $value | humanize }} SumoPod checkout calls failed in 15 min"
          description: "Creating a QRIS payment link failed twice or more in 15 minutes, so customers cannot start a payment. Check SumoPod's status and the platform-core log for 'gateway create payment failed'."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettopaymentgatewayunavailable
          dashboard_url: http://10.10.10.16:3000/d/homelab-apps-kubeletto

      # The Pro seat check fails closed on a database error: checkout answers 503
      # rather than oversell. Correct, but every customer is blocked until it clears.
      - alert: KubelettoPaymentSeatCheckFailed
        expr: kubeletto:payment_events:new_15m{event="seat_check_failed"} > 0
        labels: { severity: warning }
        annotations:
          summary: "Kubeletto: the Pro seat-capacity check failed, blocking checkout"
          description: "The seat check failed closed, so checkout is refused for every customer until it clears. It is usually a database blip; check Postgres in CT 130 and the platform-core log for 'seat check failed'."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettopaymentseatcheckfailed
          dashboard_url: http://10.10.10.16:3000/d/homelab-apps-kubeletto

      # Not a fault: the seat valve doing its job. But a paying customer was
      # turned away, which a person should know rather than learn from a ticket.
      - alert: KubelettoPaymentPlanAtCapacity
        expr: kubeletto:payment_events:new_15m{event="plan_at_capacity"} > 0
        keep_firing_for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Kubeletto: a checkout was refused because Pro is at seat capacity"
          description: "A customer tried to buy Pro and the seat cap (plan_limits max_active_seats) refused them. That is lost revenue, not a fault: raise the cap if the nodes have room (the capacity trigger alert says whether) and write to that customer."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettopaymentplanatcapacity
          dashboard_url: http://10.10.10.16:3000/d/homelab-apps-kubeletto

      # Downgrade-on-lapse and restore-on-renewal log and continue on failure by
      # design, so a stuck clamp or restore is otherwise invisible: the plan row
      # looks right while the running workload was never clamped or restored.
      - alert: KubelettoPaymentDowngradeRestoreFailed
        expr: kubeletto:payment_events:new_15m{event="downgrade_restore_failed"} > 0
        keep_firing_for: 3h
        labels: { severity: warning }
        annotations:
          summary: "Kubeletto: a plan downgrade or restore step failed for a workspace"
          description: "A lapse downgrade, a restore after renewal or a whole reconcile sweep failed for at least one service, so a workspace may be left unclamped or unrestored. Read the platform-core log for the tenant and service."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettopaymentdowngraderestorefailed
          dashboard_url: http://10.10.10.16:3000/d/homelab-apps-kubeletto
