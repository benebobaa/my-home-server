# Host alerts — node_exporter + textfile collectors on pve2/pve3 (Ansible
# `monitoring` tag) and the monitoring CT. Thresholds are set for this lab:
# see services/monitoring/README.md § Alerts.
groups:
  - name: hosts
    rules:
      # instance=~"pve.*": the CT sees its host's sysfs (power supply, hwmon),
      # so the monitoring instance would double-alert for pve2.
      # Both nodes are laptops: the battery rides through a power cut, and
      # losing AC is the earliest sign of one (or of an unplugged adapter).
      # If the hEX/ONT lost power too, this is delivered when the internet
      # returns; healthchecks.io has already alerted by then.
      - alert: HostOnBattery
        expr: node_power_supply_online{job="node", instance=~"pve.*"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is on battery: AC power lost ({{ $labels.power_supply }})"
          description: "{{ $labels.instance }} has lost AC power and runs on its battery: the first sign of a power cut or an unplugged adapter. Check whether the other node is on battery too (house power) and be ready to shut guests down cleanly if it lasts."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hostonbattery
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-hardware

      - alert: HostMemoryLow
        # job service_dmz: the K3s nodes, whose tenant requests are
        # overcommitted (Kubeletto D9); low memory there precedes evictions.
        expr: node_memory_MemAvailable_bytes{job=~"node|service_dmz"} / node_memory_MemTotal_bytes{job=~"node|service_dmz"} < 0.10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: under 10% memory available ({{ $value | humanizePercentage }})"
          description: "{{ $labels.instance }} has under 10% of its memory available for 15 min ({{ $value | humanizePercentage }}), and the kernel (or, on the K3s nodes, the kubelet evicting tenant pods) will start killing work. Find what grew first: per-guest memory on a Proxmox node, kubectl top pods on k3s."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hostmemorylow
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-nodes

      # job service_dmz: the K3s VMs (2026-10-14). The worker's disk holds the
      # tenant images and the build cache; full, the kubelet reports
      # DiskPressure and evicts tenant pods.
      - alert: HostFilesystemFull
        expr: |
          node_filesystem_avail_bytes{job=~"node|service_dmz", fstype=~"ext4|xfs|zfs|btrfs|vfat"}
            / node_filesystem_size_bytes{job=~"node|service_dmz", fstype=~"ext4|xfs|zfs|btrfs|vfat"} < 0.15
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} has {{ $value | humanizePercentage }} free; a full filesystem stops writes and, on the K3s worker, makes the kubelet evict tenant pods. Find the biggest directories with du first, and never delete by hand on VM 300's /mnt/registry (see the runbook)."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hostfilesystemfull
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-nodes

      # The guest thin pool (pve/data). At 100% every guest on it freezes and
      # can corrupt. It auto-extends at 80% (Ansible storage tag) into a small
      # VG buffer, so sitting above 85% means the buffer is being used up.
      - alert: ThinPoolFilling
        expr: node_lvm_thin_pools_allocated > 85
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: thin pool data {{ $value }}% allocated"
          description: "The guest thin pool on {{ $labels.instance }} is {{ $value }}% allocated, past its 80% auto-extend, so the small VG buffer is being used up; at 100% every guest on the pool freezes and can corrupt. Check lvs -a pve and which guest grew, then fstrim the guests."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#thinpoolfilling
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-proxmox

      - alert: ThinPoolCritical
        expr: node_lvm_thin_pools_allocated > 92
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: thin pool data {{ $value }}% — guests freeze at 100%"
          description: "The guest thin pool on {{ $labels.instance }} is {{ $value }}% allocated and every guest on it freezes and can corrupt data at 100%. Act now: fstrim every guest on that node and stop the largest non-essential one."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#thinpoolcritical
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-proxmox

      - alert: ThinPoolMetadataFilling
        expr: node_lvm_thin_pools_metadata > 75
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: thin pool metadata {{ $value }}% used"
          description: "Thin pool metadata on {{ $labels.instance }} is {{ $value }}% used, and a full metadata area stalls the pool like a full data area. Check free space in the volume group, then extend it with lvextend --poolmetadatasize."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#thinpoolmetadatafilling
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-proxmox

      # SMART (smartmon textfile collector, every 15 min). pve3's old HDD died
      # with 8,448 pending sectors (docs/runbooks/disk-rescue.md).
      - alert: DiskSmartFailing
        expr: smartmon_device_smart_healthy == 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.disk }}: SMART overall health FAILED"
          description: "{{ $labels.disk }} on {{ $labels.instance }} reports SMART overall health FAILED, so it is failing or about to lose data. Copy off what is on it now and plan the replacement (disk-rescue runbook)."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#disksmartfailing
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-hardware

      - alert: DiskPendingSectors
        expr: smartmon_current_pending_sector_raw_value > 0 or smartmon_offline_uncorrectable_raw_value > 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.disk }}: {{ $value }} unreadable sectors — copy the data off now"
          description: "{{ $labels.disk }} on {{ $labels.instance }} has {{ $value }} sectors it cannot read, the pattern in which pve3's old HDD died. Copy the data off now, before anything else, then plan the replacement."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#diskpendingsectors
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-hardware

      # pve2's HDD already has 9 reallocated sectors; growth is the signal.
      - alert: DiskReallocatedSectorsGrowing
        expr: smartmon_reallocated_sector_ct_raw_value - (smartmon_reallocated_sector_ct_raw_value offset 1d) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.disk }}: reallocated sectors grew by {{ $value }} in 24 h"
          description: "{{ $labels.disk }} on {{ $labels.instance }} reallocated {{ $value }} more sectors in 24 h, so the disk is degrading. Confirm that backups cover everything on it and plan its replacement."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#diskreallocatedsectorsgrowing
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-hardware

      - alert: DiskHot
        expr: smartmon_temperature_celsius_raw_value > 55
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.disk }}: {{ $value }} °C"
          description: "{{ $labels.disk }} on {{ $labels.instance }} has been at {{ $value }} °C for 30 min, above its 55 °C limit, and heat shortens a disk's life. Check the airflow around the laptop (lid, dust, vents)."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#diskhot
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-hardware

      # The CPU sensor is picked by its hwmon chip *name*: Intel's `coretemp`
      # (pve2, pve3) and AMD's `k10temp` (pve1, a Ryzen 5 5600; its `chip`
      # label is a PCI address, pci0000:00_0000:00:18_3, not a name). NVMe and
      # ACPI sensors share node_hwmon_temp_celsius and must not count.
      - alert: HostCpuHot
        expr: |
          max by (instance) (
            node_hwmon_temp_celsius{job="node", instance=~"pve.*"}
            * on (instance, chip) group_left ()
            (node_hwmon_chip_names{job="node", chip_name=~"coretemp|k10temp"} * 0 + 1)
          ) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: CPU at {{ $value }} °C for 10 min"
          description: "The CPU of {{ $labels.instance }} has been above 90 °C for 10 min ({{ $value }} °C now) and will throttle. Check what is using the CPU (top, a build, the GPU VM on pve1) and the airflow."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hostcpuhot
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-hardware

      # A collector that stopped writing hides every alert above.
      - alert: HostTextfileCollectorStale
        expr: time() - node_textfile_mtime_seconds{job="node", file=~".*/(smartmon|lvm)[.]prom"} > 3600
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.file }} not updated for {{ $value | humanizeDuration }}"
          description: "{{ $labels.file }} on {{ $labels.instance }} was last written {{ $value | humanizeDuration }} ago, so the disk and thin-pool alerts are blind. Check the collector's timer with systemctl list-timers on that node; after a power cut it can be a wrong RTC clock that clears by itself."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hosttextfilecollectorstale
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-nodes

      - alert: HostSystemdUnitFailed
        expr: node_systemd_unit_state{job="node", state="failed"} == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.name }} failed"
          description: "The unit {{ $labels.name }} on {{ $labels.instance }} has been in failed state for 10 min, so a service on the host is not running. Read systemctl status and journalctl -u for it, fix the cause, then reset-failed."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hostsystemdunitfailed
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-nodes

      - alert: HostClockUnsynced
        expr: node_timex_sync_status{job="node", instance=~"pve.*"} == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: clock not NTP-synchronised"
          description: "The clock of {{ $labels.instance }} has not been NTP-synchronised for 15 min, and corosync, TLS and log timestamps all suffer from drift. Check chronyc tracking and that the node reaches the router's NTP and DNS."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hostclockunsynced
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-nodes

      # Not for best-effort nodes: pve1 boots every time it is woken (ADR 0012).
      - alert: HostRebooted
        expr: changes(node_boot_time_seconds{job="node", instance=~"pve.*", tier!="best-effort"}[15m]) > 0
        labels: { severity: info }
        annotations:
          summary: "{{ $labels.instance }} rebooted (up since {{ with query (printf `node_boot_time_seconds{instance=%q}` $labels.instance) }}{{ . | first | value | humanizeTimestamp }}{{ end }})"
          description: "{{ $labels.instance }} rebooted within the last 15 min. If that was not planned, read the previous boot's journal for the reason and check HostOnBattery for a power cut."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hostrebooted
          dashboard_url: http://10.10.10.16:3000/d/homelab-infra-nodes
