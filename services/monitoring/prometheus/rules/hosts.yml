# Host alerts — node_exporter + textfile collectors on pve2/pve3 (Ansible
# `monitoring` tag) and the monitoring CT. Thresholds are set for this lab:
# see services/monitoring/README.md § Alerts.
groups:
  - name: hosts
    rules:
      # instance=~"pve.*": the CT sees its host's sysfs (power supply, hwmon),
      # so the monitoring instance would double-alert for pve2.
      # Both nodes are laptops: the battery rides through a power cut, and
      # losing AC is the earliest sign of one (or of an unplugged adapter).
      # If the hEX/ONT lost power too, this is delivered when the internet
      # returns; healthchecks.io has already alerted by then.
      - alert: HostOnBattery
        expr: node_power_supply_online{job="node", instance=~"pve.*"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is on battery: AC power lost ({{ $labels.power_supply }})"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 0.10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: under 10% memory available ({{ $value | humanizePercentage }})"

      - alert: HostFilesystemFull
        expr: |
          node_filesystem_avail_bytes{job="node", fstype=~"ext4|xfs|zfs|btrfs|vfat"}
            / node_filesystem_size_bytes{job="node", fstype=~"ext4|xfs|zfs|btrfs|vfat"} < 0.15
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"

      # The guest thin pool (pve/data). At 100% every guest on it freezes and
      # can corrupt. It auto-extends at 80% (Ansible storage tag) into a small
      # VG buffer, so sitting above 85% means the buffer is being used up.
      - alert: ThinPoolFilling
        expr: node_lvm_thin_pools_allocated > 85
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: thin pool data {{ $value }}% allocated"

      - alert: ThinPoolCritical
        expr: node_lvm_thin_pools_allocated > 92
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: thin pool data {{ $value }}% — guests freeze at 100%"

      - alert: ThinPoolMetadataFilling
        expr: node_lvm_thin_pools_metadata > 75
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: thin pool metadata {{ $value }}% used"

      # SMART (smartmon textfile collector, every 15 min). pve3's old HDD died
      # with 8,448 pending sectors (docs/runbooks/disk-rescue.md).
      - alert: DiskSmartFailing
        expr: smartmon_device_smart_healthy == 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.disk }}: SMART overall health FAILED"

      - alert: DiskPendingSectors
        expr: smartmon_current_pending_sector_raw_value > 0 or smartmon_offline_uncorrectable_raw_value > 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.disk }}: {{ $value }} unreadable sectors — copy the data off now"

      # pve2's HDD already has 9 reallocated sectors; growth is the signal.
      - alert: DiskReallocatedSectorsGrowing
        expr: smartmon_reallocated_sector_ct_raw_value - (smartmon_reallocated_sector_ct_raw_value offset 1d) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.disk }}: reallocated sectors grew by {{ $value }} in 24 h"

      - alert: DiskHot
        expr: smartmon_temperature_celsius_raw_value > 55
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.disk }}: {{ $value }} °C"

      - alert: HostCpuHot
        expr: max by (instance) (node_hwmon_temp_celsius{job="node", instance=~"pve.*", chip=~"platform_coretemp.*"}) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: CPU at {{ $value }} °C for 10 min"

      # A collector that stopped writing hides every alert above.
      - alert: HostTextfileCollectorStale
        expr: time() - node_textfile_mtime_seconds{job="node", file=~".*/(smartmon|lvm)[.]prom"} > 3600
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.file }} not updated for {{ $value | humanizeDuration }}"

      - alert: HostSystemdUnitFailed
        expr: node_systemd_unit_state{job="node", state="failed"} == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.name }} failed"

      - alert: HostClockUnsynced
        expr: node_timex_sync_status{job="node", instance=~"pve.*"} == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: clock not NTP-synchronised"

      - alert: HostRebooted
        expr: changes(node_boot_time_seconds{job="node", instance=~"pve.*"}[15m]) > 0
        labels: { severity: info }
        annotations:
          summary: "{{ $labels.instance }} rebooted (up since {{ with query (printf `node_boot_time_seconds{instance=%q}` $labels.instance) }}{{ . | first | value | humanizeTimestamp }}{{ end }})"
