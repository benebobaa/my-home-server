# The shared NATS — CT 131 `nats` (services/nats, ADR 0016), scraped through
# the `service` job (metrics: [7777] in lab.yaml, prometheus-nats-exporter).
# Down, or up without JetStream, is the generic HttpProbeFailed on its health
# URL (healthz?js-enabled-only=true); the exporter itself down is TargetDown.
groups:
  - name: app-nats
    rules:
      # Real bytes stored against the account's JetStream limit (nats.tf),
      # not the streams' reservations. At the limit, publishes to its streams
      # are refused.
      - alert: NatsAccountStorageHigh
        expr: |
          jetstream_account_storage_used{job="service"}
            / jetstream_account_max_storage{job="service"} > 0.80
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "nats: account {{ $labels.account }} uses {{ $value | humanizePercentage }} of its JetStream storage"
          description: "Account {{ $labels.account }} stores {{ $value | humanizePercentage }} of its JetStream limit, and at 100% its publishes are refused. Find which stream grew (jetstream_stream_total_bytes); usually a stream without max_age or max_bytes, or a consumer that never acks."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#natsaccountstoragehigh
          dashboard_url: http://10.10.10.16:3000/d/homelab-platform-nats

      # A durable consumer falling behind: its app stopped consuming (down,
      # stuck, or a poison message).
      - alert: NatsConsumerBacklog
        expr: jetstream_consumer_num_pending{job="service"} > 1000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "nats: consumer {{ $labels.consumer_name }} of {{ $labels.account }}/{{ $labels.stream_name }} is {{ $value }} messages behind"
          description: "Consumer {{ $labels.consumer_name }} of {{ $labels.account }}/{{ $labels.stream_name }} has {{ $value }} messages pending for 15 min, so its app stopped consuming. Check that app's logs, then restart or repair it; a poison message redelivered forever is a common cause."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#natsconsumerbacklog
          dashboard_url: http://10.10.10.16:3000/d/homelab-platform-nats

      # The CT's root disk holds the JetStream file store.
      - alert: NatsDiskFilling
        expr: |
          (pve_disk_usage_bytes / pve_disk_size_bytes)
            * on (id) group_left (name) pve_guest_info{name="nats"} > 0.80
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "nats: root disk {{ $value | humanizePercentage }} full"
          description: "CT 131's root disk, which holds the JetStream file store, is {{ $value | humanizePercentage }} full. Check du under /var/lib/nats/jetstream per account, then fix retention as for NatsAccountStorageHigh or grow disk_gb."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#natsdiskfilling
          dashboard_url: http://10.10.10.16:3000/d/homelab-platform-nats
