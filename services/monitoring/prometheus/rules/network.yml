# Reachability (blackbox_exporter) and the hEX router (SNMPv3).
groups:
  - name: reachability
    rules:
      # Severity from the host's tier in lab.yaml: critical → critical,
      # standard → warning, best-effort → info (ADR 0008).
      - alert: HostUnreachable
        expr: probe_success{job="blackbox_icmp", role!="internet"} == 0
        for: 3m
        labels:
          severity: '{{ if eq $labels.tier "critical" }}critical{{ else if eq $labels.tier "standard" }}warning{{ else }}info{{ end }}'
        annotations:
          summary: "{{ $labels.instance }} does not answer ping"
          description: "{{ $labels.instance }} has not answered ping for 3 min, and its other alerts are suppressed while this fires. For a guest check pct status on its node; for a node check power and the switch; for a device open its UI from the operator Mac."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hostunreachable
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-reachability

      # The admin gateways are an HA pair (tier standard: one down is a
      # warning). Both down = no remote access to the lab at all: critical.
      # Telegram still works then (CT 120 does not depend on Tailscale).
      - alert: RemoteAccessDown
        expr: |
          count(probe_success{job="blackbox_icmp", instance=~"admin-gw.*"} == 0)
            == count(probe_success{job="blackbox_icmp", instance=~"admin-gw.*"})
        for: 3m
        labels: { severity: critical, instance: admin-gw-pair }
        annotations:
          summary: "Both Tailscale admin gateways are unreachable: no remote access to the lab"
          description: "Both Tailscale admin gateways have been unreachable for 3 min, so nothing in the lab can be reached remotely. From home run pct list on both nodes and start or restart the gateways; if both nodes are down, suspect power."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#remoteaccessdown
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-reachability

      # Both public resolvers silent = the household uplink (Biznet) is down.
      # Telegram cannot be reached then either: this arrives when the line is
      # back, as a record of the outage.
      - alert: InternetDown
        expr: max(probe_success{job="blackbox_icmp", role="internet"}) == 0
        for: 3m
        labels: { severity: critical, instance: internet }
        annotations:
          summary: "Internet unreachable from the lab (1.1.1.1 and 8.8.8.8 silent)"
          description: "Both public resolvers have been silent for 3 min, so the uplink to the ISP is down; Telegram is unreachable while it lasts and this arrives afterwards as a record. Check RouterWanLinkDown (cable, ONT) against the ISP's own router."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#internetdown
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-reachability

      # Every `health:` URL in lab.yaml (management UIs and apps). Severity
      # from the tier, like HostUnreachable.
      - alert: HttpProbeFailed
        expr: probe_success{job="blackbox_http"} == 0
        for: 5m
        labels:
          severity: '{{ if eq $labels.tier "critical" }}critical{{ else if eq $labels.tier "standard" }}warning{{ else }}info{{ end }}'
        annotations:
          summary: "{{ $labels.instance }}: health check failing (health URL in lab.yaml)"
          description: "The health check URL of {{ $labels.instance }} has failed for 5 min, although the host may still answer ping. Run curl -sv on the URL from CT 120, then read the service's status and journal in the guest."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#httpprobefailed
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-reachability

      # Kubeletto's public path (blackbox_public): the API or the registry's
      # token endpoint does not answer as the home core from the internet.
      # HttpProbeFailed on k3s would not see a broken DNS record, tunnel or
      # Cloudflare setting: that probe goes through a NodePort in the lab.
      - alert: KubelettoPublicPathDown
        expr: probe_success{job="blackbox_public"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: Kubeletto does not answer correctly from the internet for 5 min"
          description: "{{ $labels.instance }} has not answered correctly from the internet for 5 min, so customers see Kubeletto's console, CLI or registry pulls fail. Curl the URL by hand: a Cloudflare 52x page means the tunnel, a 404 the DNS record, a timeout Traefik or core."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#kubelettopublicpathdown
          dashboard_url: http://10.10.10.16:3000/d/homelab-apps-kubeletto

      - alert: DnsResolverFailing
        expr: probe_success{job="blackbox_dns"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "hEX DNS resolver (10.10.10.1) is not resolving public names"
          description: "The router's DNS resolver has failed to resolve a public name for 3 min, so every VLAN that uses it loses name resolution. Check InternetDown first, then the resolver on the router, and flush its cache."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#dnsresolverfailing
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-reachability

  # hEX (RB750Gr3, 4-core MIPS, 256 MB) over SNMPv3, every 60 s.
  - name: router
    rules:
      # ether1 = uplink to the Biznet router. Down = no internet for the lab.
      - alert: RouterWanLinkDown
        expr: ifOperStatus{job="snmp_hex", ifName="ether1"} != 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "hEX ether1 (uplink to the Biznet router) link is down"
          description: "The router's uplink port (ether1, to the ISP's router) has had no link for 1 min, so the lab has no internet. Check the cable and the ISP's router; this is physical."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#routerwanlinkdown
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-router

      - alert: RouterCpuHigh
        expr: avg by (instance) (hrProcessorLoad{job="snmp_hex"}) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "hEX CPU at {{ $value }}% for 10 min (a DMZ tenant scan, a log flood?)"
          description: "The router CPU has been at {{ $value }}% for 10 min, which slows routing for the whole lab. Run the profile tool on the router to find the cause: a scan hitting the firewall, a log flood or SNMP walks."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#routercpuhigh
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-router

      - alert: RouterMemoryHigh
        expr: |
          hrStorageUsed{job="snmp_hex", hrStorageDescr="main memory"}
            / hrStorageSize{job="snmp_hex", hrStorageDescr="main memory"} > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "hEX memory {{ $value | humanizePercentage }} used"
          description: "The router's memory is {{ $value | humanizePercentage }} used (256 MB in total) for 15 min; large connection tables or address lists are the usual cause. Check /system resource print and, if it is a leak, reboot in a quiet moment after a snapshot."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#routermemoryhigh
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-router

      # mtxrHlTemperature is in tenths of a degree.
      - alert: RouterHot
        expr: mtxrHlTemperature{job="snmp_hex"} / 10 > 70
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "hEX board at {{ $value }} °C"
          description: "The router board has been at {{ $value }} °C, above 70 °C, for 15 min. Check the airflow around it; this is physical."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#routerhot
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-router

      # sysUpTime is in hundredths of a second.
      - alert: RouterRebooted
        expr: sysUpTime{job="snmp_hex"} / 100 < 600
        labels: { severity: info }
        annotations:
          summary: "hEX rebooted {{ $value | humanizeDuration }} ago — a power cut?"
          description: "The router came up {{ $value | humanizeDuration }} ago and it has no battery, so this is usually a power cut. Confirm with HostOnBattery firing at the same time; info only."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#routerrebooted
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-router

  # The Biznet plan (Home Internet 100 Mbps, 1500 GB a month, renews on the
  # 16th) caps the line at 5 Mbit/s once the quota is gone. The quota counts
  # what comes IN on ether1; 1500 GB a month is 50 GB a day. On 2026-11-06 it ran
  # out after about 21 days: one free tenant app, woken every two minutes, pulled
  # 40-50 GB a day and nothing warned. Warn on the pace, early.
  - name: wan-quota
    rules:
      # Inbound over the last 7 days at a pace of more than 1500 GB per 30
      # days (350 GB a week): the plan runs out before the renewal.
      - alert: WanQuotaPaceHigh
        expr: increase(ifHCInOctets{job="snmp_hex", ifName="ether1"}[7d]) > 350e9
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "WAN inbound {{ $value | humanize }}B in 7 days: on pace to use up the 1500 GB plan before it renews"
          description: "The WAN has taken in {{ $value | humanize }}B in 7 days, a pace above what the 1500 GB monthly plan allows, and when the quota is gone the line drops to 5 Mbit/s for everyone until the renewal. Run services/kubeletto/tenant-bandwidth.sh to find who is pulling."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#wanquotapacehigh
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-router

      # Inbound over the last 24 h above 60 GB (the plan allows 50 GB a day
      # on average, plus 20 % margin): something is pulling hard right now.
      - alert: WanInboundDayHigh
        expr: increase(ifHCInOctets{job="snmp_hex", ifName="ether1"}[24h]) > 60e9
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "WAN inbound {{ $value | humanize }}B in the last 24 h (the plan allows about 50 GB a day)"
          description: "{{ $value | humanize }}B came in over the WAN in the last 24 h, above the 60 GB that the plan's 50 GB a day plus margin allows, so something is pulling hard right now. Find the source as for WanQuotaPaceHigh, and pause a runaway tenant app only on the operator's call."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#waninbounddayhigh
          dashboard_url: http://10.10.10.16:3000/d/homelab-net-router

      # The Kubeletto tenant worker takes nearly all of the WAN inbound.
      # Above 2.5 Mbit/s for two hours is about 27 GB a day: more than half
      # the plan, from tenant pods alone.
      - alert: TenantWorkerInboundSustained
        expr: rate(node_network_receive_bytes_total{instance="k3s-worker", device="eth0"}[30m]) * 8 > 2.5e6
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: "k3s-worker receives {{ $value | humanize }} bit/s from the internet for 2 h: which tenant pod is pulling?"
          description: "{{ $labels.instance }} has received {{ $value | humanize }} bit/s from the internet for 2 h, over half the WAN plan from tenant pods alone. Run tenant-bandwidth.sh and look for a scale-to-zero app that something wakes every couple of minutes."
          runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#tenantworkerinboundsustained
          dashboard_url: http://10.10.10.16:3000/d/homelab-k8s-tenants
