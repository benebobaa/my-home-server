# promtool unit tests for HostCpuHot in rules/hosts.yml (make check): the
# sensor is chosen by hwmon chip name, so Intel's coretemp and AMD's k10temp
# count and a hot NVMe or ACPI sensor does not.
rule_files:
  - ../rules/hosts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # pve1 (AMD): k10temp behind a PCI-address chip label, 92 C
      - series: 'node_hwmon_chip_names{job="node",instance="pve1",chip="pci0000:00_0000:00:18_3",chip_name="k10temp"}'
        values: '1x30'
      - series: 'node_hwmon_temp_celsius{job="node",instance="pve1",chip="pci0000:00_0000:00:18_3",sensor="temp1"}'
        values: '92x30'
      # pve2 (Intel): coretemp at 70 C: no alert
      - series: 'node_hwmon_chip_names{job="node",instance="pve2",chip="platform_coretemp_0",chip_name="coretemp"}'
        values: '1x30'
      - series: 'node_hwmon_temp_celsius{job="node",instance="pve2",chip="platform_coretemp_0",sensor="temp1"}'
        values: '70x30'
      # pve3: a hot NVMe (95 C) beside a cool coretemp (60 C): no alert
      - series: 'node_hwmon_chip_names{job="node",instance="pve3",chip="platform_coretemp_0",chip_name="coretemp"}'
        values: '1x30'
      - series: 'node_hwmon_temp_celsius{job="node",instance="pve3",chip="platform_coretemp_0",sensor="temp1"}'
        values: '60x30'
      - series: 'node_hwmon_chip_names{job="node",instance="pve3",chip="nvme_nvme0",chip_name="nvme"}'
        values: '1x30'
      - series: 'node_hwmon_temp_celsius{job="node",instance="pve3",chip="nvme_nvme0",sensor="temp1"}'
        values: '95x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: HostCpuHot
        exp_alerts: []
      - eval_time: 15m
        alertname: HostCpuHot
        exp_alerts:
          - exp_labels: { severity: warning, instance: pve1 }
            exp_annotations:
              summary: "pve1: CPU at 92 °C for 10 min"
              runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hostcpuhot

  # the K3s worker's root filesystem (scraped by job service_dmz) at 10 % free
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="service_dmz",instance="k3s-worker",fstype="ext4",mountpoint="/"}'
        values: '3e9x30'
      - series: 'node_filesystem_size_bytes{job="service_dmz",instance="k3s-worker",fstype="ext4",mountpoint="/"}'
        values: '30e9x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: HostFilesystemFull
        exp_alerts:
          - exp_labels: { severity: warning, job: service_dmz, instance: k3s-worker, fstype: ext4, mountpoint: / }
            exp_annotations:
              summary: "k3s-worker: / has 10% free"
              runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#hostfilesystemfull
