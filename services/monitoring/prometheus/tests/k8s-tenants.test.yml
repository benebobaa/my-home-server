        exp_alerts:
          - exp_labels: { severity: info, namespace: kl-churn }
            exp_annotations:
              summary: "kl-churn: 210 pods in 24 h (a scale-to-zero app woken every few minutes by a pinger?)"
              runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8stenantcoldstartchurn

  # a crash loop: 2 pods of one namespace restarting 6 times an hour each
  # (12 an hour together) for 4 h; a quiet namespace with 2 restarts an hour
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{job="service_dmz",namespace="kl-loop",pod="a",container="user-container"}'
        values: '0+0.1x300'
      - series: 'kube_pod_container_status_restarts_total{job="service_dmz",namespace="kl-loop",pod="b",container="user-container"}'
        values: '0+0.1x300'
      - series: 'kube_pod_container_status_restarts_total{job="service_dmz",namespace="kl-quiet",pod="a",container="user-container"}'
        values: '0+0.0333x300'
      - series: 'kube_pod_container_status_restarts_total{job="service_dmz",namespace="kl-loop",pod="a",container="queue-proxy"}'
        values: '0+1x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: K8sTenantContainerRestarting
        exp_alerts: []
      - eval_time: 4h30m
        alertname: K8sTenantContainerRestarting
        exp_alerts:
          - exp_labels: { severity: warning, namespace: kl-loop }
            exp_annotations:
              summary: "kl-loop: tenant container restarted 12 times in the last hour, for 3 h (a crash loop)"
              runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8stenantcontainerrestarting

  # a namespace without the base policy fires; one with it does not
  - interval: 1m
    input_series:
      - series: 'kube_namespace_created{job="service_dmz",instance="k3s",namespace="kl-fenced"}'
        values: '1700000000x60'
      - series: 'kube_namespace_created{job="service_dmz",instance="k3s",namespace="kl-open"}'
        values: '1700000000x60'
      - series: 'kube_networkpolicy_created{job="service_dmz",instance="k3s",namespace="kl-fenced",networkpolicy="kubeletto-base-policy"}'
        values: '1700000000x60'
      - series: 'kube_namespace_created{job="service_dmz",instance="k3s",namespace="platform"}'
        values: '1700000000x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: K8sTenantNamespaceWithoutNetworkPolicy
        exp_alerts: []
      - eval_time: 30m
        alertname: K8sTenantNamespaceWithoutNetworkPolicy
        exp_alerts:
          - exp_labels: { severity: critical, job: service_dmz, instance: k3s, namespace: kl-open }
            exp_annotations:
              summary: "kl-open has no kubeletto-base-policy: its pods are not fenced off from the lab network"
              runbook_url: https://github.com/benebobaa/my-home-server/blob/main/docs/runbooks/alerts.md#k8stenantnamespacewithoutnetworkpolicy

  # the guard: before kube-state-metrics exports networkpolicies there is no
  # policy series at all, and nothing may fire
  - interval: 1m
    input_series:
      - series: 'kube_namespace_created{job="service_dmz",instance="k3s",namespace="kl-a"}'
        values: '1700000000x60'
      - series: 'kube_namespace_created{job="service_dmz",instance="k3s",namespace="kl-b"}'
        values: '1700000000x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: K8sTenantNamespaceWithoutNetworkPolicy
        exp_alerts: []
