# blackbox_exporter modules (installed by setup.sh to /etc/prometheus/blackbox.yml).
modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  # App health endpoints (`health:` in lab.yaml, the default module): only a
  # 2xx counts. Lab services use self-signed certificates.
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true

  # DMZ health endpoints (hosts on vlan dmz, chosen in monitoring.tf): the
  # zone runs tenant code, so the answer is untrusted. Never follow a
  # redirect (it would aim the probe at MGMT), cap the body, 2xx only.
  http_dmz:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: false
      body_size_limit: 64KB

  # Any HTTP answer counts as up (the switch login page, the PVE UI's 200/
  # redirect): this proves the management UIs respond, not that a login works.
  # The lab UIs use self-signed certificates.
  http_any:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 301, 302, 401]
      tls_config:
        insecure_skip_verify: true

  # Kubeletto's public path (Cloudflare DNS -> tunnel -> Traefik -> core),
  # from outside like a client: real certificate verified, no redirects.
  public_2xx:
    prober: http
    timeout: 15s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      body_size_limit: 64KB

  # The registry's token endpoint (core's /v1/registry/auth): unauthenticated
  # it must answer core's own 401 JSON. A Cloudflare error page, a 404 from a
  # wrong origin or a timeout fails (2026-10-14: it still pointed at the
  # frozen rented server, and pulls of platform-built images failed).
  public_registry_auth:
    prober: http
    timeout: 15s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      body_size_limit: 64KB
      valid_status_codes: [401]
      fail_if_body_not_matches_regexp: ['"UNAUTHORIZED"']

  dns_public_name:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      query_name: cloudflare.com
      query_type: A
      valid_rcodes: [NOERROR]
