# Alertmanager — one destination: the operator's Telegram.
# Rendered by secrets.sh (the only file that sees the secrets):
#   __TELEGRAM_CHAT_ID__ → the chat id; the bot token and the healthchecks.io
#   ping URL are read from files under /etc/prometheus/secrets/.
#   A receiver whose secret is not set yet is swapped for `blackhole`, so the
#   stack converges before the operator has created the accounts.
#
# Routing by severity (ADR 0008; every rule sets one, generic rules derive it
# from the target's `tier` in lab.yaml):
#   critical  Telegram now, repeated every 4 h while firing
#   warning   Telegram, but held 23:00-07:00 WIB: still firing in the
#             morning → it is sent then; resolved overnight → never sent
#   info      Telegram without sound (a record, not a page)

templates:
  - /etc/prometheus/alertmanager-templates/*.tmpl

route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Dead-man's switch: Watchdog always fires, so healthchecks.io gets a ping
    # every minute. When pings stop (power cut, pve2 down, internet down,
    # Prometheus or Alertmanager dead) healthchecks.io alerts on its own.
    - matchers: ['alertname="Watchdog"']
      receiver: healthchecks
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    - matchers: ['severity="critical"']
      receiver: telegram
      repeat_interval: 4h

    - matchers: ['severity="warning"']
      receiver: telegram
      mute_time_intervals: [night]

    - matchers: ['severity="info"']
      receiver: telegram_silent

time_intervals:
  - name: night
    time_intervals:
      - times:
          - { start_time: "23:00", end_time: "24:00" }
          - { start_time: "00:00", end_time: "07:00" }
        location: Asia/Jakarta

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/prometheus/secrets/telegram_bot_token
        chat_id: __TELEGRAM_CHAT_ID__
        parse_mode: HTML
        message: '{{ template "homelab.telegram" . }}'
        send_resolved: true

  - name: telegram_silent
    telegram_configs:
      - bot_token_file: /etc/prometheus/secrets/telegram_bot_token
        chat_id: __TELEGRAM_CHAT_ID__
        parse_mode: HTML
        message: '{{ template "homelab.telegram" . }}'
        disable_notifications: true
        send_resolved: false

  - name: healthchecks
    webhook_configs:
      - url_file: /etc/prometheus/secrets/healthchecks_ping_url
        send_resolved: false

  - name: blackhole

inhibit_rules:
  # A host that does not answer ping is the one alert; do not also send
  # "scrape failed" / "UI down" for it.
  - source_matchers: ['alertname="HostUnreachable"']
    target_matchers: ['alertname=~"TargetDown|HttpProbeFailed|DnsResolverFailing"']
    equal: [instance]
  # Internet down: the HTTP/DNS-to-outside alerts are symptoms of it.
  - source_matchers: ['alertname="InternetDown"']
    target_matchers: ['alertname="DnsResolverFailing"']
  # A PVE node down explains its guests.
  - source_matchers: ['alertname="PveNodeDown"']
    target_matchers: ['alertname="PveGuestDown"']
    equal: [node]
