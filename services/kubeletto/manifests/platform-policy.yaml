# NATS runs without auth (prod's live config; wave 2 adds per-user auth).
# Until then the network is its only lock: only platform-core and build
# pods may reach it — tenant pods could otherwise read every tenant's live
# logs and publish platform events.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-platform-and-builds
  namespace: nats
  labels: {app.kubernetes.io/managed-by: homeserver-repo}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kubeletto-builds}}
