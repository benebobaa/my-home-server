# NATS runs without auth (prod's live config; wave 2 adds per-user auth).
# Until then the network is its only lock, so only platform-core may reach
# it. Not tenant pods (they could read every tenant's live logs and publish
# platform events), and not build pods either: builds run untrusted
# Dockerfile steps, and get NATS access only together with wave 2's
# per-user NATS auth (phase 2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-platform-and-builds
  namespace: nats
  labels: {app.kubernetes.io/managed-by: homeserver-repo}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform}}
          podSelector: {matchLabels: {app.kubernetes.io/name: platform-core}}
