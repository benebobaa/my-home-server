apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: kubeletto
    app.kubernetes.io/managed-by: homeserver-repo
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: kubeletto
    spec:
      containers:
        - env:
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  key: http-secret
                  name: registry-http-secret
          image: registry:2
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            tcpSocket:
              port: 5000
            timeoutSeconds: 3
          name: registry
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 5000
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 4Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/docker/registry/config.yml
              name: resolved-config
              readOnly: true
              subPath: config.yml
            - mountPath: /etc/docker/registry/auth
              name: auth-public-key
              readOnly: true
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - -c
            - 'cp /templates/config.yml.tmpl /resolved/config.yml

              sed -i "s|\${REGISTRY_S3_ACCESS_KEY}|${REGISTRY_S3_ACCESS_KEY}|g" /resolved/config.yml

              sed -i "s|\${REGISTRY_S3_SECRET_KEY}|${REGISTRY_S3_SECRET_KEY}|g" /resolved/config.yml

              sed -i "s|\${REGISTRY_S3_ENDPOINT}|${REGISTRY_S3_ENDPOINT}|g" /resolved/config.yml

              sed -i "s|\${REGISTRY_READONLY}|${REGISTRY_READONLY:-false}|g" /resolved/config.yml

              echo "Registry config resolved successfully."

              '
          env:
            - name: REGISTRY_READONLY
              value: 'false'
            - name: REGISTRY_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: access-key
                  name: registry-r2-credentials
            - name: REGISTRY_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-key
                  name: registry-r2-credentials
            - name: REGISTRY_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  key: endpoint
                  name: registry-r2-credentials
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          name: config-init
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /templates
              name: config-template
              readOnly: true
            - mountPath: /resolved
              name: resolved-config
      priorityClassName: kubeletto-platform-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: registry-config
          name: config-template
        - emptyDir: {}
          name: resolved-config
        - name: auth-public-key
          secret:
            defaultMode: 420
            secretName: registry-auth-public-key
      nodeSelector:
        node-role.kubernetes.io/control-plane: 'true'
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
