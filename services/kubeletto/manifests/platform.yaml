apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app.kubernetes.io/part-of: kubeletto
    app.kubernetes.io/managed-by: homeserver-repo
  name: user-apps
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: HostRegexp(`^[a-z0-9-]+\.kubeletto\.app$`)
      middlewares:
        - name: ratelimit-user-apps
          namespace: traefik
      services:
        - name: kourier
          namespace: kourier-system
          port: 80
  tls:
    domains:
      - main: '*.kubeletto.app'
        sans:
          - kubeletto.app
    secretName: kubeletto-app-tls
