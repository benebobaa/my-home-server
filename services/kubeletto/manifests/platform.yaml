apiVersion: v1
data:
  config.yml.tmpl: "version: 0.1\n\nlog:\n  level: info\n  formatter: text\n\nauth:\n  token:\n    realm: https://api.kubeletto.com/v1/registry/auth\n\
    \    service: registry.kubeletto.com\n    issuer: kubeletto\n    rootcertbundle: /etc/docker/registry/auth/public.pem\n\
    \nstorage:\n  s3:\n    accesskey: ${REGISTRY_S3_ACCESS_KEY}\n    secretkey: ${REGISTRY_S3_SECRET_KEY}\n    region: auto\n\
    \    regionendpoint: ${REGISTRY_S3_ENDPOINT}\n    bucket: kubeletto-registry\n    rootdirectory: /\n    secure: \"true\"\
    \n    chunksize: 104857600\n  delete:\n    enabled: true\n  cache:\n    blobdescriptor: inmemory\n  # GC read-only toggle\
    \ (Risk 3). Baked into the YAML (NOT set via the\n  # REGISTRY_STORAGE_MAINTENANCE_READONLY_ENABLED env var, which panics:\n\
    \  # \"readonly config key must contain additional keys\" \u2014 the env override\n  # can't build this nested map). config-init\
    \ substitutes the literal\n  # below from the REGISTRY_READONLY env (default \"false\"); the registry-gc\n  # CronJob\
    \ flips it to \"true\" for the duration of garbage collection.\n  maintenance:\n    readonly:\n      enabled: ${REGISTRY_READONLY}\n\
    \nhttp:\n  addr: :5000\n  headers:\n    X-Content-Type-Options:\n      - nosniff\n    Access-Control-Allow-Origin:\n \
    \     - \"*\"\n    Access-Control-Allow-Methods:\n      - GET\n      - HEAD\n      - POST\n      - PUT\n      - DELETE\n\
    \    Access-Control-Allow-Headers:\n      - Authorization\n      - Content-Type\n\nhealth:\n  storagedriver:\n    enabled:\
    \ true\n    interval: 10s\n    threshold: 3\n"
