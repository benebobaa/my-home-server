# Redis for platform-core at home (replaces Upstash). Holds only cache, deploy
# locks, rate limits and event idempotency keys, so no persistence: a restart
# starts empty, which Kubeletto tolerates (runbook kubeletto-migration.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: platform
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/managed-by: homeserver-repo}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      priorityClassName: kubeletto-platform-critical
      nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: docker.io/library/redis:7.4.6-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: platform
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/managed-by: homeserver-repo}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
# Only platform-core talks to Redis; tenants (worker node) must not.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: platform
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: redis}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: platform-core}}}]
      ports: [{port: 6379}]
