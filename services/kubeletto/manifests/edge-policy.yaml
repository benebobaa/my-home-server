# The edge at home is reachable only along the tunnel path:
#   cloudflared -> Traefik -> Kourier -> tenant pods
# Tenant pods (worker node) cannot call Traefik or Kourier directly, so they
# cannot forge forwarded headers past the allowlist / rate limits, or skip
# Traefik's middlewares. Kubelet probes come from the node and stay allowed
# (K3s's kube-router admits node-local traffic).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-cloudflared-only
  namespace: traefik
  labels: {app.kubernetes.io/managed-by: homeserver-repo}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudflared}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-traefik-and-knative
  namespace: kourier-system
  labels: {app.kubernetes.io/managed-by: homeserver-repo}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: knative-serving}}
