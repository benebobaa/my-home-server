# Traefik for Kubeletto at home: prod's Helm values (`helm get values traefik
# -n traefik` on 2026-10-11, chart traefik/traefik 40.2.0 = Traefik v3.7.1),
# with the home changes marked. Rendered by apply.sh, chart version pinned there.
additionalArguments:
  - --entrypoints.web.http.redirections.entryPoint.to=:443
  - --entrypoints.web.http.redirections.entryPoint.scheme=https
  - --entrypoints.web.http.redirections.entryPoint.priority=1
  - --providers.kubernetescrd.allowCrossNamespace=true
  - --entrypoints.metrics.address=:9100
  - --metrics.prometheus=true
  - --metrics.prometheus.entrypoint=metrics
  - --log.level=INFO
  - --accesslog=true
  - --accesslog.format=json
deployment:
  replicas: 1
gateway: {enabled: false}
gatewayClass: {enabled: false}
ingressRoute:
  dashboard: {enabled: false}
providers:
  kubernetesCRD: {enabled: true, namespaces: []}
  kubernetesIngress: {enabled: true, namespaces: []}
rbac: {enabled: true, namespaced: false}
resources:
  limits: {cpu: 500m, memory: 256Mi}
  requests: {cpu: 50m, memory: 64Mi}
# home: ClusterIP, not LoadBalancer — the tunnel is the only way in, and
# ServiceLB would open 80/443 on the DMZ node addresses.
service:
  enabled: true
  spec:
    type: ClusterIP   # chart 40 reads service.spec.type (prod's service.type is ignored)
# home: on the server node with the rest of the platform.
priorityClassName: kubeletto-platform-critical
nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
tolerations:
  - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
# home: requests arrive from the cloudflared pods on the server node (pod CIDR
# 10.42.0.0/24 — tenants run on the worker's 10.42.1.0/24 and cannot forge
# these headers). Trust X-Forwarded-* from there only, and don't append the
# pod address, so the right-most X-Forwarded-For entry stays the client IP
# Cloudflare added (ipStrategy depth 1 in the allowlist and rate limits).
ports:
  web:
    forwardedHeaders: {trustedIPs: ["10.42.0.0/24"], notAppendXForwardedFor: true}
  websecure:
    forwardedHeaders: {trustedIPs: ["10.42.0.0/24"], notAppendXForwardedFor: true}
