# The lab's hosts and addresses — the single source of truth (ADR 0007).
#
# Read by both OpenTofu stacks through the `inventory/` module (validated
# there: unique IPs and VMIDs, every IP inside its VLAN). Change an address
# here, never in a .tf file. Next consumers: the Ansible inventory and the
# Prometheus targets.
#
# Conventions
#   VMIDs   101-109 access/edge     110-119 storage/data
#           120-129 observability   130-139 databases
#           140-149 workstations (pve1, on demand)
#           200-299 apps            300-399 tenant (DMZ)
#   IPs     .1 gateway (hEX); MGMT .11-.13 nodes, .14 PBS, .15+ infra guests;
#           other VLANs: .10-.49 static, .100-.199 DHCP (VLANs 30/40/50 only)
#   status  live = exists now; planned = reserved, not built
#   dns     A record <name>.home.arpa on the hEX (default: true when live)
#   monitoring  required on every live host — the observability standard
#           (ADR 0008, docs/standards/observability.md):
#             tier           critical | standard | best-effort (alert severity)
#             health         URL probed by blackbox; {ip} = this host's IP
#             health_module  http_2xx (default) | http_any (UIs: 401/redirect ok)
#             metrics        [ports] scraped at http://<ip>:<port>/metrics
#             logs           true = ships its journal (or syslog) to `logs`
#           or `monitoring: none` with the reason in `note`.

# Every lab VLAN except the native switch segment lives inside this range
# ("to anything in the lab" rules on the hEX).
supernet: 10.10.0.0/16

vlans:
  native:  { id: 1,  cidr: 192.168.99.0/29, gateway: 192.168.99.1, note: switch management only }
  mgmt:    { id: 10, cidr: 10.10.10.0/24,   gateway: 10.10.10.1,   note: "nodes, PBS, admin" }
  servers: { id: 20, cidr: 10.10.20.0/24,   gateway: 10.10.20.1,   note: "production guests, static IPs" }
  dmz:     { id: 25, cidr: 10.10.25.0/24,   gateway: 10.10.25.1,   note: "tenant zone, exact pinholes only" }
  lab:     { id: 30, cidr: 10.10.30.0/24,   gateway: 10.10.30.1,   dhcp: true, note: "testing, internet only, DHCP" }
  trusted: { id: 40, cidr: 10.10.40.0/24,   gateway: 10.10.40.1,   dhcp: true, note: "operator devices, DHCP" }
  iot:     { id: 50, cidr: 10.10.50.0/24,   gateway: 10.10.50.1,   dhcp: true, note: "IoT/guest, internet only, DHCP" }
  cluster: { id: 60, cidr: 10.10.60.0/24,   gateway: null,         note: "corosync/migration, L2 only" }

hosts:
  # --- network devices ------------------------------------------------------
  hex:
    kind: device
    vlan: mgmt
    ip: 10.10.10.1
    note: MikroTik hEX RB750Gr3 (also 192.168.99.1 native, 192.168.88.1 OOB ether3)
    monitoring: { tier: critical, logs: true } # SNMP + DNS probe: services/monitoring; logs = remote syslog
  switch:
    kind: device
    vlan: native
    ip: 192.168.99.2
    note: TP-Link SG108E
    monitoring: { tier: standard, health: "http://{ip}/", health_module: http_any }

  # --- Proxmox nodes ----------------------------------------------------------
  pve1:
    kind: node
    vlan: mgmt
    ip: 10.10.10.11
    cluster_ip: 10.10.60.11
    note: desktop, Ryzen 5 5600, 32 GB, RTX 3060; always on (ADR 0023)
    # standard: always on like the other nodes, so being down is critical.
    monitoring: { tier: standard, health: "https://{ip}:8006/", health_module: http_any, logs: true }
  pve2:
    kind: node
    vlan: mgmt
    ip: 10.10.10.12
    cluster_ip: 10.10.60.12
    note: Asus i3 laptop, 12 GB; stateful guests
    monitoring: { tier: critical, health: "https://{ip}:8006/", health_module: http_any, logs: true }
  pve3:
    kind: node
    vlan: mgmt
    ip: 10.10.10.13
    cluster_ip: 10.10.60.13
    note: Asus i3 laptop, 8 GB; stateless guests only (no-name SSD)
    monitoring: { tier: critical, health: "https://{ip}:8006/", health_module: http_any, logs: true }

  # --- guests -----------------------------------------------------------------
  admin-gw:
    kind: lxc
    vmid: 101
    node: pve3
    vlan: mgmt
    ip: 10.10.10.15
    note: Tailscale subnet router (services/admin-gw)
    monitoring: { tier: standard, logs: true } # one of an HA pair
  admin-gw2:
    kind: lxc
    vmid: 102
    node: pve2
    vlan: mgmt
    ip: 10.10.10.17
    note: second Tailscale subnet router, same routes — HA pair with admin-gw (services/admin-gw)
    monitoring: { tier: standard, logs: true } # one of an HA pair
  archive:
    kind: lxc
    vmid: 110
    node: pve2
    vlan: servers
    ip: 10.10.20.30
    dns: false # no record yet; adding one is its own change
    note: family archive, File Browser over Tailscale (services/archive)
    monitoring: { tier: standard, logs: true } # File Browser listens on localhost only (Tailscale serve): no health URL
  monitoring:
    kind: lxc
    vmid: 120
    node: pve2
    vlan: mgmt
    ip: 10.10.10.16
    note: Prometheus, Alertmanager, Grafana (services/monitoring)
    monitoring: { tier: critical, health: "http://{ip}:3000/api/health", logs: true }
  logs:
    kind: lxc
    vmid: 121
    node: pve2
    vlan: mgmt
    ip: 10.10.10.18
    note: VictoriaLogs — journald + hEX syslog for the whole lab (services/logs)
    monitoring: { tier: standard, health: "http://{ip}:9428/health", metrics: [9428], logs: true }
  postgres:
    kind: lxc
    vmid: 130
    node: pve2
    vlan: servers
    ip: 10.10.20.21
    note: the lab's shared PostgreSQL 18, one database + role per app (ADR 0010, services/postgres)
    monitoring: { tier: standard, metrics: [9187], logs: true } # no HTTP side: pg_up from the exporter (app-postgres.yml); critical once an app depends on it
  nats:
    kind: lxc
    vmid: 131
    node: pve2 # JetStream is state
    vlan: servers
    ip: 10.10.20.22
    note: the lab's shared NATS with JetStream, one account per app; apps outside VLAN 20 attach a leaf node (ADR 0016, services/nats)
    # 8222 is NATS's own monitoring port (healthz fails without JetStream);
    # 7777 is prometheus-nats-exporter reading it (app-nats.yml).
    monitoring: { tier: standard, health: "http://{ip}:8222/healthz?js-enabled-only=true", metrics: [7777], logs: true }
  valkey:
    kind: lxc
    vmid: 132
    node: pve3 # a cache, nothing to keep: off pve2's CPU
    vlan: servers
    ip: 10.10.20.23
    note: the lab's shared Valkey, one instance (process, port, password) per app, TLS only, no persistence (ADR 0016, services/valkey)
    # no HTTP side: one redis_exporter per instance, 9121 upward, redis_up is
    # the health check (app-valkey.yml)
    monitoring: { tier: standard, metrics: [9121, 9122], logs: true }
  pbs:
    kind: lxc
    vmid: 111
    node: pve3
    vlan: mgmt
    ip: 10.10.10.14
    note: Proxmox Backup Server — nightly backups of every guest; on pve3, apart from the stateful guests (ADR 0009, services/pbs)
    monitoring: { tier: standard, health: "https://{ip}:8007/", health_module: http_any, logs: true }

  k3s:
    kind: vm
    vmid: 300
    node: pve2 # stays: pve1 is on demand, no always-on services (ADR 0012)
    vlan: dmz
    ip: 10.10.25.20
    dns: false # resolves through public resolvers (no home.arpa from the DMZ)
    note: Kubeletto tenant cluster — K3s VM (tenants run arbitrary code, so a VM, not an LXC; ADR 0004)
    # DMZ: no log shipping into MGMT. Kubeletto's monitoring NodePorts
    # (Kubeletto repo infra/k8s/home/monitoring.yaml): 30080 is a proxy that
    # serves core's /readyz and nothing else; 30910 is Traefik's metrics;
    # 9100 node_exporter (node-exporter.yaml, hostNetwork; tenant egress
    # denies node IPs); 30931 kube-state-metrics (kube-state-metrics.yaml:
    # unschedulable pods, memory requests, MemoryPressure). All admit only
    # the monitoring host.
    monitoring: { tier: standard, health: "http://{ip}:30080/readyz", metrics: [30910, 30931, 9100] }
  k3s-worker:
    kind: vm
    vmid: 301
    node: pve3 # stateless: tenant pods and builds only (state lives in Postgres and R2)
    vlan: dmz
    ip: 10.10.25.21
    dns: false
    note: Kubeletto tenant cluster — K3s agent (worker) VM for tenant workloads and builds
    # best-effort: a worker can go (its pods reschedule onto k3s). 9100 is
    # node_exporter, for its memory: tenant requests are overcommitted
    # (Kubeletto docs/migration D9).
    monitoring: { tier: best-effort, metrics: [9100] }
  ai:
    kind: vm
    vmid: 140
    node: pve1 # the GPU node; on demand, started by the operator (ADR 0023, 0012)
    vlan: lab # internet only: runs code from pip, model hubs and GitHub
    ip: 10.10.30.10
    note: AI workstation — Ubuntu 24.04, RTX 3060 by passthrough; reached via the admin gateways' route (services/ai/)
    # best-effort: off by design most days; pve1 being down explains it.
    # No logs: it runs untrusted code (pip, model hubs, GitHub), so like the
    # DMZ it never pushes into MGMT (VictoriaLogs serves queries on 9428).
    # 9835: nvidia_gpu_exporter (GPU temperature, power, clocks, VRAM;
    # ADR 0014), scraped with the untrusted-zone limits. LLM bench lab
    # (ADR 0019, temporary): 9100 node_exporter (per-core CPU), 8000 the
    # engine under test (vLLM/SGLang /metrics; down while none runs or
    # Ollama runs: TargetDown is info for best-effort, a silent record).
    monitoring: { tier: best-effort, logs: false, metrics: [9835, 9100, 8000] }
  hermes:
    kind: lxc
    vmid: 141
    node: pve1 # on demand like ai: the bot is online while pve1 is up (ADR 0018)
    vlan: lab # internet only: the agent runs shell commands chosen by a model
    ip: 10.10.30.11
    note: personal agent — Hermes Agent, Telegram gateway (services/hermes/)
    # best-effort: off whenever pve1 is. No logs: untrusted zone (ADR 0013).
    # No health URL or metrics: Telegram polling opens no port.
    monitoring: { tier: best-effort, logs: false }

  llm-bench:
    kind: lxc
    vmid: 201
    node: pve2 # its results are backed up; pve3 gets nothing new
    vlan: servers
    ip: 10.10.20.40
    note: TEMPORARY LLM serving bench client (GuideLLM, lm-eval) → ai:8000; removed after the article (ADR 0019, services/llm-bench)
    # best-effort: a load generator, nothing depends on it. No HTTP side.
    # No logs: it runs code from PyPI and the Hugging Face hub, and the log
    # store's insert port also answers queries (the LAB rule, ADR 0013).
    monitoring: { tier: best-effort, logs: false }

  # --- reserved ---------------------------------------------------------------
  edge:
    kind: lxc
    vlan: dmz
    ip: 10.10.25.10
    status: planned
    note: deferred VPS path only (wg 10.99.0.2)
